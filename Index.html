<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Postal del Polo Norte — Amigo Invisible Familiar</title>
<!-- Fuentes navideñas con carga asíncrona no bloqueante (apertura en <50ms) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Berkshire+Swash&family=Mountains+of+Christmas:wght@700&family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">

<style>
  :root {
    --paper: #FBF7F0;
    --paper-dark: #F2E8D5;
    --crimson: #B81D24;
    --crimson-dark: #821015;
    --pine: #164A31;
    --pine-dark: #0C2B1C;
    --gold: #C8963E;
    --gold-light: #FDF3DF;
    --ink: #231F20;
    --muted: #6B6257;
    --border: #D9CCB8;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    background-color: #113221;
    background-image:
      radial-gradient(#1f5438 1.5px, transparent 1.5px),
      radial-gradient(#19422c 1.5px, #113221 1.5px);
    background-size: 28px 28px;
    background-position: 0 0, 14px 14px;
    font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: var(--ink);
    min-height: 100vh;
    padding: 12px;
    display: flex;
    justify-content: center;
    align-items: flex-start;
  }

  /* Contenedor principal tipo Postal Navideña */
  .postcard {
    width: 100%;
    max-width: 600px;
    background: var(--paper);
    border-radius: 24px;
    border: 3px solid var(--gold);
    box-shadow: 0 16px 40px rgba(0,0,0,0.48);
    overflow: hidden;
    position: relative;
    margin-bottom: 28px;
  }

  /* Franja clásica de Correo Aéreo del Polo Norte */
  .airmail-stripe {
    height: 14px;
    background: repeating-linear-gradient(
      -45deg,
      var(--crimson),
      var(--crimson) 15px,
      var(--paper) 15px,
      var(--paper) 23px,
      var(--pine) 23px,
      var(--pine) 38px,
      var(--paper) 38px,
      var(--paper) 46px
    );
    border-bottom: 2px solid var(--gold);
  }
  .airmail-stripe.bottom {
    border-bottom: none;
    border-top: 2px solid var(--gold);
  }

  /* Cabecera del Sorteo (Super limpia para entrada directa desde WhatsApp) */
  .hero-header {
    text-align: center;
    padding: 22px 16px 18px;
    border-bottom: 2px dashed var(--border);
    position: relative;
    background: radial-gradient(circle at top, #FFFDF9 0%, var(--paper) 100%);
  }

  .christmas-title {
    font-family: 'Berkshire Swash', 'Mountains of Christmas', Georgia, serif;
    font-size: 2.2rem;
    color: var(--crimson);
    line-height: 1.15;
    text-shadow: 1px 2px 0px #F3D9B1;
    margin-bottom: 6px;
  }

  .meta-pills {
    display: flex;
    justify-content: center;
    gap: 8px;
    flex-wrap: wrap;
    margin-top: 10px;
  }

  .meta-pill {
    background: var(--pine);
    color: #fff;
    padding: 6px 13px;
    border-radius: 99px;
    font-size: 0.8rem;
    font-weight: 700;
  }
  .meta-pill.gold {
    background: var(--gold-light);
    color: var(--ink);
    border: 1.5px solid var(--gold);
  }

  .content {
    padding: 18px 16px 14px;
  }

  /* Pie de postal discreto con acceso oculto a Organización */
  .postal-footer {
    padding: 12px 16px 16px;
    text-align: center;
    border-top: 2px dashed var(--border);
    display: flex;
    justify-content: center;
    align-items: center;
  }
  .btn-stealth-admin {
    background: var(--paper-dark);
    border: 2px solid var(--border);
    color: var(--muted);
    font-size: 0.78rem;
    font-weight: 800;
    cursor: pointer;
    padding: 8px 16px;
    border-radius: 99px;
    font-family: inherit;
    box-shadow: 0 3px 0 var(--border);
    transition: transform 0.08s, box-shadow 0.08s, color 0.15s, border-color 0.15s;
  }
  .btn-stealth-admin:hover {
    color: var(--pine);
    border-color: var(--pine);
  }
  .btn-stealth-admin:active {
    transform: translateY(2px);
    box-shadow: 0 1px 0 var(--border);
  }

  /* Selector de 36 Avatares con relieve 3D */
  .avatar-picker-grid {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 9px;
    margin: 14px 0;
  }
  .avatar-option-btn {
    height: 50px;
    border-radius: 16px;
    border: 2.5px solid var(--pine);
    background: #fff;
    font-size: 1.5rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 0 var(--pine-dark);
    transition: transform 0.08s, box-shadow 0.08s;
  }
  .avatar-option-btn:active {
    transform: translateY(3px);
    box-shadow: 0 1px 0 var(--pine-dark);
  }
  .avatar-option-btn.selected {
    border-color: var(--crimson);
    background: var(--gold-light);
    box-shadow: 0 4px 0 var(--crimson-dark);
  }

  /* Botones 3D Artesanales Grandes */
  .btn-big {
    width: 100%;
    padding: 16px 20px;
    border-radius: 20px;
    font-size: 1.04rem;
    font-weight: 800;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    transition: transform 0.08s, box-shadow 0.08s;
    border: 2.5px solid transparent;
    text-align: center;
    font-family: inherit;
  }
  .btn-big:active {
    transform: translateY(3px);
  }

  .btn-red {
    background: var(--crimson);
    color: #fff;
    border-color: var(--crimson-dark);
    box-shadow: 0 5px 0 var(--crimson-dark);
  }
  .btn-red:active {
    box-shadow: 0 2px 0 var(--crimson-dark);
  }

  .btn-green {
    background: var(--pine);
    color: #fff;
    border-color: var(--pine-dark);
    box-shadow: 0 5px 0 var(--pine-dark);
  }
  .btn-green:active {
    box-shadow: 0 2px 0 var(--pine-dark);
  }

  .btn-gold {
    background: #FDE68A;
    color: #781014;
    border-color: #B45309;
    box-shadow: 0 5px 0 #92400E;
  }
  .btn-gold:active {
    box-shadow: 0 2px 0 #92400E;
  }

  .btn-back {
    background: #FFFDF9;
    color: var(--ink);
    border-color: var(--pine);
    box-shadow: 0 5px 0 var(--pine-dark);
    margin-bottom: 16px;
  }
  .btn-back:active {
    box-shadow: 0 2px 0 var(--pine-dark);
  }

  /* Botones medianos 3D para Acciones de Usuario y Organización (Nada de botones cuadrados planos) */
  .btn-3d-pill {
    padding: 11px 16px;
    border-radius: 16px;
    font-size: 0.86rem;
    font-weight: 800;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    border: 2.5px solid var(--pine);
    background: #FFFDF9;
    color: var(--pine);
    box-shadow: 0 4px 0 var(--pine-dark);
    transition: transform 0.08s, box-shadow 0.08s;
    font-family: inherit;
    text-align: center;
    line-height: 1.2;
  }
  .btn-3d-pill:active {
    transform: translateY(3px);
    box-shadow: 0 1px 0 var(--pine-dark);
  }
  .btn-3d-pill.red {
    background: #FFF5F5;
    color: var(--crimson);
    border-color: var(--crimson);
    box-shadow: 0 4px 0 var(--crimson-dark);
  }
  .btn-3d-pill.red:active {
    box-shadow: 0 1px 0 var(--crimson-dark);
  }
  .btn-3d-pill.red-solid {
    background: var(--crimson);
    color: #fff;
    border-color: var(--crimson-dark);
    box-shadow: 0 4px 0 var(--crimson-dark);
  }
  .btn-3d-pill.green-solid {
    background: var(--pine);
    color: #fff;
    border-color: var(--pine-dark);
    box-shadow: 0 4px 0 var(--pine-dark);
  }
  .btn-3d-pill.gold {
    background: var(--gold-light);
    color: #781014;
    border-color: #B45309;
    box-shadow: 0 4px 0 #92400E;
  }
  .btn-3d-pill.gold:active {
    box-shadow: 0 1px 0 #92400E;
  }
  .btn-stealth-admin {
    background: transparent;
    border: none;
    color: var(--muted);
    font-size: 0.74rem;
    font-weight: 700;
    opacity: 0.55;
    cursor: pointer;
    padding: 4px 8px;
    border-radius: 8px;
    font-family: inherit;
    transition: opacity 0.15s;
  }
  .btn-stealth-admin:hover, .btn-stealth-admin:active {
    opacity: 1;
    background: var(--paper-dark);
  }

  /* Selector de 36 Avatares */
  .avatar-picker-grid {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 8px;
    margin: 12px 0;
  }
  .avatar-option-btn {
    height: 46px;
    border-radius: 12px;
    border: 2px solid var(--border);
    background: #fff;
    font-size: 1.45rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.08s;
  }
  .avatar-option-btn:active {
    transform: scale(0.92);
  }
  .avatar-option-btn.selected {
    border-color: var(--crimson);
    background: var(--gold-light);
    box-shadow: 0 3px 0 var(--crimson-dark);
  }

  /* Botones 3D Artesanales Grandes */
  .btn-big {
    width: 100%;
    padding: 15px 18px;
    border-radius: 16px;
    font-size: 1.02rem;
    font-weight: 800;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 9px;
    transition: transform 0.08s, box-shadow 0.08s;
    border: 2.5px solid transparent;
    text-align: center;
    font-family: inherit;
  }
  .btn-big:active {
    transform: translateY(3px);
  }

  .btn-red {
    background: var(--crimson);
    color: #fff;
    border-color: var(--crimson-dark);
    box-shadow: 0 5px 0 var(--crimson-dark);
  }
  .btn-green {
    background: var(--pine);
    color: #fff;
    border-color: var(--pine-dark);
    box-shadow: 0 5px 0 var(--pine-dark);
  }
  .btn-gold {
    background: #FDE68A;
    color: #781014;
    border-color: #D97706;
    box-shadow: 0 5px 0 #B45309;
  }
  .btn-back {
    background: var(--paper-dark);
    color: var(--ink);
    border-color: var(--ink);
    box-shadow: 0 4px 0 var(--ink);
    margin-bottom: 16px;
  }

  /* Etiquetas de sección */
  .section-label {
    font-family: 'Mountains of Christmas', Georgia, serif;
    font-size: 1.4rem;
    font-weight: 700;
    color: var(--pine);
    margin: 4px 0 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }

  .divider-ready {
    margin: 22px 0 12px;
    padding-top: 14px;
    border-top: 2px dashed var(--border);
    font-size: 0.8rem;
    font-weight: 800;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    text-align: center;
  }

  /* Cuadrícula de Participantes (2 columnas en móvil, botones grandes) */
  .grid-users {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
  }

  .user-card {
    background: #fff;
    border: 2.5px solid var(--pine);
    border-radius: 18px;
    padding: 15px 10px;
    text-align: center;
    cursor: pointer;
    box-shadow: 0 4px 0 var(--pine-dark);
    transition: transform 0.08s;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 7px;
    position: relative;
    font-family: inherit;
  }
  .user-card:active {
    transform: translateY(3px);
    box-shadow: 0 1px 0 var(--pine-dark);
  }

  /* Los que faltan por elegir (ARRIBA DEL TODO, borde rojo vivo) */
  .user-card.unclaimed {
    background: #FFFDF9;
    border-color: var(--crimson);
    box-shadow: 0 5px 0 var(--crimson-dark);
  }

  /* Los que ya tienen PIN (ABAJO DEL TODO, estilo pino) */
  .user-card.claimed {
    background: var(--paper-dark);
    border-color: #7D9285;
    box-shadow: 0 3px 0 #5C6E63;
  }

  .avatar-circle {
    width: 50px;
    height: 50px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.35rem;
    font-weight: 800;
    color: #fff;
    background: var(--crimson);
    border: 2.5px solid #fff;
    box-shadow: 0 3px 8px rgba(0,0,0,0.22);
    overflow: hidden;
    position: relative;
    flex-shrink: 0;
  }
  .user-card.claimed .avatar-circle {
    background: var(--pine);
  }
  .avatar-circle.has-photo {
    background: #FFFFFF !important;
  }
  .avatar-circle img.celeb-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center 12%;
    transform: scale(1.18);
    background: #FFFFFF;
    border-radius: 50%;
    display: block;
  }
  .avatar-circle img.celeb-img.is-crest {
    object-fit: contain;
    object-position: center center;
    transform: scale(0.86);
    padding: 3px;
    background: #FFFFFF;
  }
  .avatar-circle img.celeb-img.is-flag {
    object-fit: cover;
    object-position: center center;
    transform: scale(1.02);
    background: #FFFFFF;
  }

  /* Pestañas de Carpetas de Avatares */
  .folder-tabs {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin: 10px 0 12px;
  }
  .folder-tab-btn {
    padding: 8px 11px;
    border-radius: 12px;
    border: 2px solid var(--pine);
    background: #fff;
    color: var(--pine);
    font-weight: 800;
    font-size: 0.76rem;
    cursor: pointer;
    box-shadow: 0 3px 0 var(--pine-dark);
    font-family: inherit;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    transition: transform 0.08s;
  }
  .folder-tab-btn:active {
    transform: translateY(2px);
  }
  .folder-tab-btn.active {
    background: var(--crimson);
    border-color: var(--crimson-dark);
    color: #fff;
    box-shadow: 0 3px 0 var(--crimson-dark);
  }

  /* Galería de Avatares (Foto tipo carnet fondo blanco) */
  .celeb-picker-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin: 12px 0;
  }
  @media (min-width: 440px) {
    .celeb-picker-grid {
      grid-template-columns: repeat(4, 1fr);
    }
  }
  .celeb-card-btn {
    background: #fff;
    border: 2.5px solid var(--border);
    border-radius: 16px;
    padding: 10px 6px 8px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    box-shadow: 0 4px 0 var(--border);
    transition: transform 0.08s, box-shadow 0.08s, border-color 0.1s;
    font-family: inherit;
  }
  .celeb-card-btn:active {
    transform: translateY(3px);
    box-shadow: 0 1px 0 var(--border);
  }
  .celeb-card-btn.selected {
    border-color: var(--crimson);
    background: var(--gold-light);
    box-shadow: 0 4px 0 var(--crimson-dark);
  }
  .celeb-card-btn .avatar-circle {
    width: 62px;
    height: 62px;
    border: 2.5px solid var(--gold);
    background: #FFFFFF;
  }
  .celeb-card-name {
    font-size: 0.73rem;
    font-weight: 800;
    color: var(--ink);
    line-height: 1.15;
    text-align: center;
  }

  .user-name {
    font-weight: 800;
    font-size: 1.05rem;
    color: var(--ink);
    line-height: 1.2;
  }

  .status-tag {
    font-size: 0.72rem;
    font-weight: 800;
    padding: 3px 9px;
    border-radius: 8px;
  }
  .tag-new {
    background: #FEE2E2;
    color: var(--crimson);
  }
  .tag-locked {
    background: #DCFCE7;
    color: var(--pine);
  }

  /* Teclado Numérico de PIN */
  .pin-box {
    background: #fff;
    border: 2.5px solid var(--gold);
    border-radius: 20px;
    padding: 18px 14px;
    text-align: center;
    box-shadow: 0 6px 18px rgba(0,0,0,0.06);
  }

  .pin-dots {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin: 16px 0;
  }

  .pin-dot {
    width: 50px;
    height: 56px;
    border: 2.5px solid var(--pine);
    border-radius: 14px;
    background: var(--paper);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.7rem;
    font-weight: 800;
    color: var(--crimson);
  }
  .pin-dot.filled {
    background: var(--gold-light);
    border-color: var(--crimson);
  }

  .keypad {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    max-width: 310px;
    margin: 0 auto;
  }

  .key-btn {
    padding: 15px 0;
    font-size: 1.35rem;
    font-weight: 800;
    border-radius: 14px;
    border: 2px solid var(--border);
    background: var(--paper);
    color: var(--ink);
    cursor: pointer;
    box-shadow: 0 3px 0 var(--border);
    font-family: inherit;
  }
  .key-btn:active {
    transform: translateY(2px);
    box-shadow: none;
  }

  /* Contador de Marcha Atrás en Tiempo Real */
  .countdown-banner {
    background: linear-gradient(145deg, var(--pine), var(--pine-dark));
    color: #fff;
    border-radius: 20px;
    padding: 18px 14px;
    text-align: center;
    border: 2.5px solid var(--gold);
    margin-bottom: 16px;
    box-shadow: 0 8px 20px rgba(12,43,28,0.25);
  }
  .countdown-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin-top: 12px;
  }
  .cd-unit {
    background: rgba(255,255,255,0.12);
    padding: 10px 4px;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.22);
  }
  .cd-num {
    font-size: 1.55rem;
    font-weight: 800;
    color: #FDE68A;
    display: block;
    line-height: 1.1;
  }
  .cd-lbl {
    font-size: 0.68rem;
    text-transform: uppercase;
    opacity: 0.9;
    font-weight: 700;
  }

  /* Sobre Lacrado para Desvelar */
  .envelope-box {
    background: linear-gradient(160deg, #A3181E, #6E0E12);
    border: 3px solid var(--gold);
    border-radius: 22px;
    padding: 24px 16px;
    color: #fff;
    text-align: center;
    box-shadow: 0 10px 24px rgba(184,29,36,0.3);
    margin-bottom: 18px;
  }

  .wax-seal {
    width: 78px;
    height: 78px;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #FBBF24, #B45309);
    border: 3px dashed #FEF3C7;
    display: flex;
    align-items: center;
  /* Menú Principal del Usuario: 4 Botones en UNA SOLA LÍNEA con estilo 3D */
  .user-tabs {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 7px;
    margin-bottom: 18px;
  }
  .tab-btn {
    padding: 10px 4px;
    border-radius: 16px;
    border: 2.5px solid var(--pine);
    background: #fff;
    color: var(--ink);
    font-weight: 800;
    font-size: 0.74rem;
    line-height: 1.15;
    cursor: pointer;
    text-align: center;
    box-shadow: 0 4px 0 var(--pine-dark);
    font-family: inherit;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    gap: 5px;
    transition: transform 0.08s, box-shadow 0.08s;
  }
  .tab-btn:active {
    transform: translateY(3px);
    box-shadow: 0 1px 0 var(--pine-dark);
  }
  .tab-btn .tab-icon-badge {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: var(--paper-dark);
    border: 2px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.1rem;
    overflow: hidden;
    flex-shrink: 0;
  }
  .tab-btn .tab-sub-pill {
    font-size: 0.64rem;
    font-weight: 800;
    padding: 2px 6px;
    border-radius: 99px;
    background: var(--paper-dark);
    color: var(--muted);
    max-width: 100%;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .tab-btn.active {
    background: var(--crimson);
    border-color: var(--crimson-dark);
    color: #fff;
    box-shadow: 0 4px 0 var(--crimson-dark);
  }
  .tab-btn.active .tab-icon-badge {
    background: #fff;
    border-color: var(--gold);
  }
  .tab-btn.active .tab-sub-pill {
    background: #FDE68A;
    color: #781014;
  }

  /* Barra Superior de Sesión del Participante */
  .user-session-bar {
    display: flex;

function showToast(msg) {
  const el = document.getElementById('toast');
  if (!el) return;
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(() => el.classList.remove('show'), 3200);
}

function getCountdownParts(isoDate) {
  const target = new Date(isoDate).getTime();
  const now = Date.now();
  const diff = Math.max(0, target - now);
  const days = String(Math.floor(diff / (1000 * 60 * 60 * 24))).padStart(2, '0');
  const hours = String(Math.floor((diff / (1000 * 60 * 60)) % 24)).padStart(2, '0');
  const mins = String(Math.floor((diff / 1000 / 60) % 60)).padStart(2, '0');
  const secs = String(Math.floor((diff / 1000) % 60)).padStart(2, '0');
  return { days, hours, mins, secs };
}

setInterval(() => {
  const draw = getCurrentDraw();
  if (!draw || draw.status !== 'countdown') return;
  const cd = getCountdownParts(draw.countdownIso || '2026-12-20T20:00:00');
  const dEl = document.getElementById('cd-days');
  if (dEl) {
    dEl.textContent = cd.days;
    document.getElementById('cd-hours').textContent = cd.hours;
    document.getElementById('cd-mins').textContent = cd.mins;
    document.getElementById('cd-secs').textContent = cd.secs;
  }
}, 1000);

// Devuelve la foto tipo carnet (fondo blanco, cara en grande) o la INICIAL si no hay avatar
function getAvatarDisplay(person) {
  const av = person && person.avatar ? String(person.avatar).trim() : '';
  if (av) {
    const celeb = SPANISH_CELEBS.find(c => c.id === av);
    if (celeb) {
      const wikiUrl = `https://commons.wikimedia.org/wiki/Special:FilePath/${celeb.wiki}?width=280`;
      const fallbackUri = buildCelebFallbackDataUri(celeb);
      const extraClass = celeb.kind === 'crest' ? 'is-crest' : (celeb.kind === 'flag' ? 'is-flag' : 'is-face');
      return `<img class="celeb-img ${extraClass}" src="${wikiUrl}" alt="${celeb.name}" onerror="this.onerror=null;this.src='${fallbackUri}';" />`;
    }
    if (av.startsWith('http://') || av.startsWith('https://') || av.startsWith('data:image')) {
      return `<img class="celeb-img" src="${av}" alt="Avatar" />`;
    }
    return av;
  }
  const cleanName = (person?.name || '?').trim();
  return cleanName.charAt(0).toUpperCase();
}

// Renderiza el bloque reutilizable de carpetas + cuadrícula de avatares
function buildCategorizedAvatarPickerHtml(selectedAvatarId, clickHandlerName, userIdArg = null) {
  const folderButtons = AVATAR_FOLDERS.map(f => `
    <button type="button" class="folder-tab-btn ${activeAvatarFolder === f.id ? 'active' : ''}" onclick="window.app.setAvatarFolder('${f.id}')">
      <span>${f.label}</span>
    </button>
  `).join('');

  const itemsInFolder = SPANISH_CELEBS.filter(c => c.folder === activeAvatarFolder);

  const cardsHtml = itemsInFolder.map(celeb => {
    const wikiUrl = `https://commons.wikimedia.org/wiki/Special:FilePath/${celeb.wiki}?width=280`;
    const fallbackUri = buildCelebFallbackDataUri(celeb);
    const extraClass = celeb.kind === 'crest' ? 'is-crest' : (celeb.kind === 'flag' ? 'is-flag' : 'is-face');
    const onClickCall = userIdArg
      ? `window.app.${clickHandlerName}('${userIdArg}', '${celeb.id}')`
      : `window.app.${clickHandlerName}('${celeb.id}')`;

    return `
      <button type="button" class="celeb-card-btn ${selectedAvatarId === celeb.id ? 'selected' : ''}" onclick="${onClickCall}">
        <div class="avatar-circle has-photo">
          <img class="celeb-img ${extraClass}" src="${wikiUrl}" alt="${celeb.name}" onerror="this.onerror=null;this.src='${fallbackUri}';" />
        </div>
        <span class="celeb-card-name">${celeb.name}</span>
      </button>
    `;
  }).join('');

  return `
    <div class="folder-tabs">${folderButtons}</div>
    <div class="celeb-picker-grid">${cardsHtml}</div>
  `;
}

function getCelebNameLabel(avatarId, personName) {
  if (!avatarId) return `Inicial (${(personName || '?').trim().charAt(0).toUpperCase()})`;
  const celeb = SPANISH_CELEBS.find(c => c.id === avatarId);
  return celeb ? celeb.name : 'Foto personalizada';
}

// Registra un sorteo en la "Mochila" del usuario para vincular sus sorteos sin registro
function rememberInMyBag(draw, user) {
  if (!draw || !user) return;
  const exists = myBag.some(item => item.drawId === draw.id && item.userName.toLowerCase() === user.name.toLowerCase());
  if (!exists) {
    myBag.push({
      drawId: draw.id,
      userName: user.name,
      familyCode: draw.familyCode || draw.id
    });
    localStorage.setItem(MY_BAG_KEY, JSON.stringify(myBag));
  }
}

// Encuentra todos los sorteos vinculados a este usuario (por Mochila, por Código de Familia o por coincidencia de Nombre + mismo PIN)
function getLinkedDrawsForUser(currentUserObj, currentDrawObj) {
  if (!currentUserObj) return [];
  const uName = currentUserObj.name.trim().toLowerCase();
  const uPin = currentUserObj.pin;
  const currentFam = (currentDrawObj?.familyCode || '').trim().toUpperCase();

  return draws.filter(d => {
    // 1. Mismo código de familia (ej. Histórico de otros años de FAM-RODRIGO)
    if (currentFam && (d.familyCode || '').trim().toUpperCase() === currentFam) return true;
    // 2. Está guardado en su Mochila del navegador
    if (myBag.some(b => b.drawId === d.id || (b.familyCode && b.familyCode === d.familyCode))) return true;
    // 3. Tiene el mismo nombre y el mismo PIN de 4 dígitos en otro grupo (ej. Marcos con PIN 1234 en Familia y en Amigos)
    if (uPin && d.participants.some(p => p.name.trim().toLowerCase() === uName && p.pin === uPin)) return true;
    return false;
  });
}

async function initCloudStorage() {
  try {
    if (typeof __firebase_config === 'undefined' || !__firebase_config) return;
    const firebaseConfig = JSON.parse(__firebase_config);
    const app = initializeApp(firebaseConfig);
    auth = getAuth(app);
    db = getFirestore(app);

    if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
      await signInWithCustomToken(auth, __initial_auth_token);
    } else {
      await signInAnonymously(auth);
    }

    onAuthStateChanged(auth, (user) => {
      currentUser = user;
      if (!user) return;

      stateDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'amigo_invisible_draws', 'main_state');

      onSnapshot(
        stateDocRef,
        (snapshot) => {
          if (snapshot.exists()) {
            const cloudData = snapshot.data();
            if (cloudData && Array.isArray(cloudData.draws)) {
              draws = cloudData.draws;
              localStorage.setItem(LOCAL_BACKUP_KEY, JSON.stringify(draws));

              if (cloudData.adminPinCode) {
                adminPinCode = cloudData.adminPinCode;
                localStorage.setItem(ADMIN_PASS_KEY, adminPinCode);
              }

              if (urlDrawId && draws.some(d => d.id === urlDrawId) && !window._urlDrawApplied) {
                currentDrawId = urlDrawId;
                window._urlDrawApplied = true;
              } else if (!draws.some(d => d.id === currentDrawId)) {
                currentDrawId = draws[0]?.id || null;
              }

              const activeTag = document.activeElement?.tagName;
              if (activeTag !== 'INPUT' && activeTag !== 'SELECT') {
                renderAll();
              } else {
                renderHeader();
              }
            }
          } else {
            saveStateToCloud();
          }
        },
        (err) => {
          console.error('Error en suscripción Firestore:', err);
        }
      );
    });
  } catch (err) {
    console.error('Fallo iniciando Firebase:', err);
  }
}

async function saveStateToCloud() {
  localStorage.setItem(LOCAL_BACKUP_KEY, JSON.stringify(draws));
  localStorage.setItem(ADMIN_PASS_KEY, adminPinCode);
  if (!currentUser || !stateDocRef) return;
  try {
    await setDoc(stateDocRef, {
      draws: draws,
      adminPinCode: adminPinCode,
      updatedAt: Date.now(),
      updatedBy: currentUser.uid
    });
  } catch (err) {
    console.error('Error guardando en la nube:', err);
  }
}

/* =========================================================
   10. CONFETI LIGERO EN CANVAS NATIVO
========================================================= */
function launchConfetti() {
  const canvas = document.getElementById('confetti');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  const pieces = Array.from({ length: 65 }, () => ({
    x: Math.random() * canvas.width,
    y: -20 - Math.random() * 100,
    size: 6 + Math.random() * 6,
    vy: 3 + Math.random() * 4.5,
    vx: -2.2 + Math.random() * 4.4,
    color: ['#B81D24', '#164A31', '#F59E0B', '#FBF7F0'][Math.floor(Math.random() * 4)]
  }));

  let frame = 0;
  function step() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    pieces.forEach(p => {
      p.x += p.vx;
      p.y += p.vy;
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x, p.y, p.size, p.size);
    });
    frame++;
    if (frame < 80) requestAnimationFrame(step);
    else ctx.clearRect(0, 0, canvas.width, canvas.height);
  }
  requestAnimationFrame(step);
}

  switchDraw(drawId) {
    currentDrawId = drawId;
    currentScreen = 'grid';
    selectedUserId = null;
    enteredPin = '';
    confirmDeleteDrawId = null;
    renderAll();
  },

  switchToLatestActiveDraw() {

      currentScreen = 'grid';

    if (!targetDraw) return;
    currentDrawId = drawId;
    if (targetUserId && targetDraw.participants.some(p => p.id === targetUserId && p.pin)) {
      selectedUserId = targetUserId;
      userTab = 'status';
      currentScreen = 'dashboard';
    } else {
      selectedUserId = null;
      currentScreen = 'grid';
    }
    renderAll();
    showToast(`🎄 Cambiado a "${targetDraw.title}"`);
  },

  linkFamilyByCode() {
    const codeInput = document.getElementById('joinFamilyCodeInput');
    const code = (codeInput?.value || '').trim().toUpperCase();
    if (!code) {
      showToast('Escribe el código de familia o sorteo');
      return;
    }
    const found = draws.find(d =>
      (d.familyCode && d.familyCode.toUpperCase() === code) ||
      d.id.toUpperCase() === code
    );
    if (!found) {
      showToast('❌ No se encontró ningún sorteo con ese código');
      return;
    }
    const draw = getCurrentDraw();
    const user = draw?.participants.find(p => p.id === selectedUserId);
    myBag.push({
      drawId: found.id,
      userName: user ? user.name : '',
      familyCode: found.familyCode || found.id
    });
    localStorage.setItem(MY_BAG_KEY, JSON.stringify(myBag));
    showToast(`✅ Grupo "${found.title}" vinculado a tus sorteos`);
    renderDashboardScreen();
  },

  requestAdminAccess() {
    if (currentScreen === 'admin') {
      currentScreen = 'grid';
      renderAll();
      return;
    }
    enteredAdminPin = '';
    currentScreen = 'admin_login';
    renderAll();
  },

  pressAdminPinKey(digit) {
    if (enteredAdminPin.length >= 4) return;
    enteredAdminPin += digit;
    if (!updateAdminPinDotsOnly()) renderAdminLoginScreen();
    if (enteredAdminPin.length === 4) {
      setTimeout(() => {
        if (enteredAdminPin === adminPinCode) {
          currentScreen = 'admin';
          renderAll();
        } else {
          enteredAdminPin = '';
          updateAdminPinDotsOnly();
          const fb = document.getElementById('adminPinFeedback');
          if (fb) fb.textContent = '❌ Clave de organizador incorrecta';
        }
      }, 120);
    }
  },

  backspaceAdminPin() {
    enteredAdminPin = enteredAdminPin.slice(0, -1);
    if (!updateAdminPinDotsOnly()) renderAdminLoginScreen();
  },

  clearAdminPin() {
    enteredAdminPin = '';
    if (!updateAdminPinDotsOnly()) renderAdminLoginScreen();
  },

  backspaceAdminPin() {
    enteredAdminPin = enteredAdminPin.slice(0, -1);
    renderAdminLoginScreen();
  },

  clearAdminPin() {
    enteredAdminPin = '';
    renderAdminLoginScreen();
  },

  changeAdminPin() {
    const val = (document.getElementById('newAdminPinInput')?.value || '').trim();
    if (!/^\d{4}$/.test(val)) {
      showToast('La clave debe tener 4 números');
      return;
    }
    adminPinCode = val;
    saveStateToCloud();
    showToast('🔐 Nueva clave de organizador guardada');
  },

  adminSelectDraw(drawId) {
    currentDrawId = drawId;
    adminEditingAvatarUserId = null;
    renderAll();
    showToast('Editando sorteo seleccionado');
  },

  selectParticipant(userId) {
    selectedUserId = userId;
    enteredPin = '';
    justJoinedWelcome = false;
    currentScreen = 'pin';
    renderAll();
  },

  backToGrid() {
    selectedUserId = null;
    enteredPin = '';
    confirmDeleteDrawId = null;
    adminEditingAvatarUserId = null;
    currentScreen = 'grid';
    renderAll();
  },

  pressPinKey(digit) {
    if (enteredPin.length >= 4) return;
    enteredPin += digit;
    const fb = document.getElementById('pinFeedback');
    if (fb) fb.textContent = '';
    if (!updatePinDotsOnly()) renderPinScreen();
    if (enteredPin.length === 4) {
      setTimeout(() => window.app.validatePin(), 130);
    }
  },

  backspacePin() {
    enteredPin = enteredPin.slice(0, -1);
    if (!updatePinDotsOnly()) renderPinScreen();
  },

  clearPin() {
    enteredPin = '';
    if (!updatePinDotsOnly()) renderPinScreen();
  },

  validatePin() {
    const draw = getCurrentDraw();
    const user = draw?.participants.find(p => p.id === selectedUserId);
    if (!user) return;

    if (!user.pin) {
      user.pin = enteredPin;
      justJoinedWelcome = true;
      userTab = 'status';
      rememberInMyBag(draw, user);
      saveStateToCloud();
      launchConfetti();
      showToast(`🎄 ¡Bienvenido/a, ${user.name}! PIN guardado.`);
      currentScreen = 'dashboard';
      renderAll();
    } else if (user.pin === enteredPin) {
      justJoinedWelcome = false;
      userTab = 'status';
      rememberInMyBag(draw, user);
      currentScreen = 'dashboard';
      renderAll();
    } else {
      enteredPin = '';
      updatePinDotsOnly();
      const fb = document.getElementById('pinFeedback');
      if (fb) fb.textContent = '❌ PIN incorrecto. Si lo olvidaste, pide al organizador que lo resetee.';
    }
  },

  setUserTab(tab) {
    userTab = tab;
    justJoinedWelcome = false;
    renderDashboardScreen();
  },

  setAvatarFolder(folderId) {
    activeAvatarFolder = folderId;
    if (currentScreen === 'admin') renderAdminScreen();
    else renderDashboardScreen();
  },

  setMyAvatar(iconOrNull) {
    const draw = getCurrentDraw();
    const user = draw?.participants.find(p => p.id === selectedUserId);
    if (!user) return;
    user.avatar = iconOrNull;
    saveStateToCloud();
    const label = getCelebNameLabel(iconOrNull, user.name);
    showToast(iconOrNull ? `🎭 Ahora tu avatar es ${label}` : '🔤 Mostrando tu inicial');
    renderAll();
  },

  toggleAdminAvatarEditor(userId) {
    adminEditingAvatarUserId = (adminEditingAvatarUserId === userId) ? null : userId;
    renderAdminScreen();
  },

  setParticipantAvatarFromAdmin(userId, iconOrNull) {
    const draw = getCurrentDraw();
    const user = draw?.participants.find(p => p.id === userId);
    if (!user) return;
    user.avatar = iconOrNull;
    adminEditingAvatarUserId = null;
    saveStateToCloud();
    showToast(`🎨 Avatar de ${user.name} actualizado`);
    renderAdminScreen();
  },

  selectNewMemberAvatar(iconOrNull) {
    newParticipantAvatar = iconOrNull;
    renderAdminScreen();
  },

  revealMyTarget() {
    const draw = getCurrentDraw();
    const user = draw?.participants.find(p => p.id === selectedUserId);
    if (!user) return;
    user.revealed = true;
    saveStateToCloud();
    launchConfetti();
    renderDashboardScreen();
  },

  hideMyTargetAgain() {
    const draw = getCurrentDraw();
    const user = draw?.participants.find(p => p.id === selectedUserId);
    if (!user) return;
    user.revealed = false;
    saveStateToCloud();
    renderDashboardScreen();
  },

  addWish() {
    const titleEl = document.getElementById('wishTitle');
    const noteEl = document.getElementById('wishNote');
    const title = titleEl?.value.trim();
    const note = noteEl?.value.trim() || '';
    if (!title) {
      showToast('Escribe primero qué regalo te gustaría');
      return;
    }

    const draw = getCurrentDraw();
    const user = draw?.participants.find(p => p.id === selectedUserId);
    if (!user) return;
    if (!Array.isArray(user.wishes)) user.wishes = [];
    user.wishes.push({ title, note });
    saveStateToCloud();
    showToast('✨ Deseo añadido a tu lista');
    renderDashboardScreen();
  },

  removeWish(index) {
    const draw = getCurrentDraw();
    const user = draw?.participants.find(p => p.id === selectedUserId);
    if (!user || !Array.isArray(user.wishes)) return;
    user.wishes.splice(index, 1);
    saveStateToCloud();
    showToast('Deseo eliminado');
    renderDashboardScreen();
  },

  executeLiveDraw() {
    const draw = getCurrentDraw();
    if (!draw || draw.participants.length < 2) {
      showToast('Necesitas al menos 2 participantes para sortear');
      return;
    }

    const shuffled = [...draw.participants].sort(() => Math.random() - 0.5);
    for (let i = 0; i < shuffled.length; i++) {
      const giver = shuffled[i];
      const receiver = shuffled[(i + 1) % shuffled.length];
      const realUser = draw.participants.find(p => p.id === giver.id);
      realUser.targetId = receiver.id;
      realUser.revealed = false;
    }

    draw.status = 'drawn';
    saveStateToCloud();
    launchConfetti();
    showToast('🎰 ¡Sorteo en directo completado!');
    renderAll();
  },

  toggleCountdownMode() {
    const draw = getCurrentDraw();
    if (!draw) return;
    if (draw.status === 'countdown') {
      if (!draw.participants[0]?.targetId) {
        window.app.executeLiveDraw();
        return;
      }
      draw.status = 'drawn';
      showToast('✨ Modo "Ya Sorteado" activado');
    } else {
      draw.status = 'countdown';
      showToast('⏳ Modo "Cuenta Atrás" activado');
    }
    saveStateToCloud();
    renderAll();
  },

  saveDrawDetails() {
    const draw = getCurrentDraw();
    if (!draw) return;
    const t = document.getElementById('editDrawTitle')?.value.trim();
    const fc = document.getElementById('editDrawFamilyCode')?.value.trim().toUpperCase();
    const dt = document.getElementById('editDrawDateText')?.value.trim();
    const b = document.getElementById('editDrawBudget')?.value.trim();
    const iso = document.getElementById('editDrawIso')?.value;

    if (t) draw.title = t;
    if (fc) draw.familyCode = fc;
    if (dt) draw.dateText = dt;
    if (b) draw.budget = b;
    if (iso) draw.countdownIso = iso;

    saveStateToCloud();
    showToast('💾 Datos del sorteo guardados');
    renderAll();
  },

  resetUserPin(userId) {
    const draw = getCurrentDraw();
    const user = draw?.participants.find(p => p.id === userId);
    if (!user) return;
    user.pin = null;
    saveStateToCloud();
    showToast(`🔄 PIN de ${user.name} reseteado (vuelve arriba de la lista)`);
    renderAdminScreen();
  },

  addParticipant() {
    const input = document.getElementById('newMemberName');
    const name = input?.value.trim();
    if (!name) return;
    const draw = getCurrentDraw();
    draw.participants.push({
      id: 'u_' + Date.now(),
      name,
      avatar: newParticipantAvatar || null,
      pin: null,
      targetId: null,
      revealed: false,
      wishes: []
    });
    newParticipantAvatar = null;
    saveStateToCloud();
    showToast(`➕ ${name} añadido al sorteo`);
    renderAdminScreen();
  },

  removeParticipant(userId) {
    const draw = getCurrentDraw();
    if (!draw) return;
    draw.participants = draw.participants.filter(p => p.id !== userId);
    saveStateToCloud();
    showToast('Participante eliminado');
    renderAdminScreen();
  },

  archiveDraw(drawId) {
    const d = draws.find(x => x.id === drawId);
    if (!d) return;
    d.status = 'archived';
    saveStateToCloud();
    showToast(`📜 "${d.title}" guardado en el histórico`);
    renderAll();
  },

  askDeleteDraw(drawId) {
    confirmDeleteDrawId = drawId;
    renderAdminScreen();
  },

  confirmDeleteDraw(drawId) {
    draws = draws.filter(d => d.id !== drawId);
    confirmDeleteDrawId = null;
    if (currentDrawId === drawId) {
      currentDrawId = draws[0]?.id || null;
    }
    saveStateToCloud();
    showToast('🗑️ Sorteo eliminado permanentemente');
    renderAll();
  },

  createNewDraw() {
    const title = document.getElementById('newDrawTitle')?.value.trim();
    const familyCode = (document.getElementById('newDrawFamilyCode')?.value.trim() || 'MI-FAMILIA').toUpperCase();
    const budget = document.getElementById('newDrawBudget')?.value.trim() || '35€';
    const dateText = document.getElementById('newDrawDate')?.value.trim() || '24 Dic 2026';
    const membersRaw = document.getElementById('newDrawMembers')?.value.trim();

    if (!title) {
      showToast('Ponle un título al nuevo sorteo');
      return;
    }

    const names = membersRaw
      ? membersRaw.split(',').map(s => s.trim()).filter(Boolean)
      : ['Participante 1', 'Participante 2', 'Participante 3'];

    const participants = names.map((n, idx) => ({
      id: 'p_' + Date.now() + '_' + idx,
      name: n,
      avatar: null,
      pin: null,
      targetId: null,
      revealed: false,
      wishes: []
    }));

    if (participants.length >= 2) {
      for (let i = 0; i < participants.length; i++) {
        participants[i].targetId = participants[(i + 1) % participants.length].id;
      }
    }

    const newDraw = {
      id: 'sorteo-' + Date.now(),
      familyCode,
      title,
      dateText,
      countdownIso: '2026-12-20T20:00:00',
      budget,
      status: 'countdown',
      participants
    };

    draws.unshift(newDraw);
    currentDrawId = newDraw.id;
    saveStateToCloud();
    launchConfetti();
    showToast(`🎄 Creado "${title}"`);
    renderAdminScreen();
  },

  copyWhatsAppLinkForDraw(drawId) {
    const targetDraw = draws.find(d => d.id === drawId) || getCurrentDraw();
    if (!targetDraw) return;
    currentDrawId = targetDraw.id;
    const baseUrl = window.location.href.split('?')[0];
    const shareUrl = `${baseUrl}?sorteo=${encodeURIComponent(targetDraw.id)}`;
    const textToCopy = `🎄 *${targetDraw.title}* (${targetDraw.budget})\nEntra aquí, toca tu nombre, pon tu PIN de 4 números y rellena tu lista de deseos:\n${shareUrl}`;

    const tempInput = document.createElement('textarea');
    tempInput.value = textToCopy;
    document.body.appendChild(tempInput);
    tempInput.select();
    document.execCommand('copy');
    document.body.removeChild(tempInput);

    showToast(`📲 Link de WhatsApp copiado para "${targetDraw.title}"`);
    renderHeader();
  }
};

renderAll();
initCloudStorage();
</script>
</body>
</html>
