<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Postal del Polo Norte — Amigo Invisible Familiar</title>
<!-- Fuentes navideñas con carga asíncrona no bloqueante (apertura en <50ms) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Berkshire+Swash&family=Mountains+of+Christmas:wght@700&family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">

<style>
  :root {
    --paper: #FBF7F0;
    --paper-dark: #F2E8D5;
    --crimson: #B81D24;
    --crimson-dark: #821015;
    --pine: #164A31;
    --pine-dark: #0C2B1C;
    --gold: #C8963E;
    --gold-light: #FDF3DF;
    --ink: #231F20;
    --muted: #6B6257;
    --border: #D9CCB8;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    background-color: #113221;
    background-image:
      radial-gradient(#1f5438 1.5px, transparent 1.5px),
      radial-gradient(#19422c 1.5px, #113221 1.5px);
    background-size: 28px 28px;
    background-position: 0 0, 14px 14px;
    font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: var(--ink);
    min-height: 100vh;
    padding: 12px;
    display: flex;
    justify-content: center;
    align-items: flex-start;
  }

  /* Contenedor principal tipo Postal Navideña */
  .postcard {
    width: 100%;
    max-width: 600px;
    background: var(--paper);
    border-radius: 24px;
    border: 3px solid var(--gold);
    box-shadow: 0 16px 40px rgba(0,0,0,0.48);
    overflow: hidden;
    position: relative;
    margin-bottom: 28px;
  }

  /* Franja clásica de Correo Aéreo del Polo Norte */
  .airmail-stripe {
    height: 14px;
    background: repeating-linear-gradient(
      -45deg,
      var(--crimson),
      var(--crimson) 15px,
      var(--paper) 15px,
      var(--paper) 23px,
      var(--pine) 23px,
      var(--pine) 38px,
      var(--paper) 38px,
      var(--paper) 46px
    );
    border-bottom: 2px solid var(--gold);
  }
  .airmail-stripe.bottom {
    border-bottom: none;
    border-top: 2px solid var(--gold);
  }

  /* Cabecera del Sorteo (Super limpia para entrada directa desde WhatsApp) */
  .hero-header {
    text-align: center;
    padding: 22px 16px 18px;
    border-bottom: 2px dashed var(--border);
    position: relative;
    background: radial-gradient(circle at top, #FFFDF9 0%, var(--paper) 100%);
  }

  .christmas-title {
    font-family: 'Berkshire Swash', 'Mountains of Christmas', Georgia, serif;
    font-size: 2.2rem;
    color: var(--crimson);
    line-height: 1.15;
    text-shadow: 1px 2px 0px #F3D9B1;
    margin-bottom: 6px;
  }

  .meta-pills {
    display: flex;
    justify-content: center;
    gap: 8px;
    flex-wrap: wrap;
    margin-top: 10px;
  }

  .meta-pill {
    background: var(--pine);
    color: #fff;
    padding: 6px 13px;
    border-radius: 99px;
    font-size: 0.8rem;
    font-weight: 700;
  }
  .meta-pill.gold {
    background: var(--gold-light);
    color: var(--ink);
    border: 1.5px solid var(--gold);
  }

  .content {
    padding: 18px 16px 14px;
  }

  /* Pie de postal discreto con acceso oculto a Organización */
  .postal-footer {
    padding: 12px 16px 16px;
    text-align: center;
    border-top: 2px dashed var(--border);
    display: flex;
    justify-content: center;
    align-items: center;
  }
  .btn-stealth-admin {
    background: var(--paper-dark);
    border: 2px solid var(--border);
    color: var(--muted);
    font-size: 0.78rem;
    font-weight: 800;
    cursor: pointer;
    padding: 8px 16px;
    border-radius: 99px;
    font-family: inherit;
    box-shadow: 0 3px 0 var(--border);
    transition: transform 0.08s, box-shadow 0.08s, color 0.15s, border-color 0.15s;
  }
  .btn-stealth-admin:hover {
    color: var(--pine);
    border-color: var(--pine);
  }
  .btn-stealth-admin:active {
    transform: translateY(2px);
    box-shadow: 0 1px 0 var(--border);
  }

  /* Selector de 36 Avatares con relieve 3D */
  .avatar-picker-grid {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 9px;
    margin: 14px 0;
  }
  .avatar-option-btn {
    height: 50px;
    border-radius: 16px;
    border: 2.5px solid var(--pine);
    background: #fff;
    font-size: 1.5rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 0 var(--pine-dark);
    transition: transform 0.08s, box-shadow 0.08s;
  }
  .avatar-option-btn:active {
    transform: translateY(3px);
    box-shadow: 0 1px 0 var(--pine-dark);
  }
  .avatar-option-btn.selected {
    border-color: var(--crimson);
    background: var(--gold-light);
    box-shadow: 0 4px 0 var(--crimson-dark);
  }

  /* Botones 3D Artesanales Grandes */
  .btn-big {
    width: 100%;
    padding: 16px 20px;
    border-radius: 20px;
    font-size: 1.04rem;
    font-weight: 800;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    transition: transform 0.08s, box-shadow 0.08s;
    border: 2.5px solid transparent;
    text-align: center;
    font-family: inherit;
  }
  .btn-big:active {
    transform: translateY(3px);
  }

  .btn-red {
    background: var(--crimson);
    color: #fff;
    border-color: var(--crimson-dark);
    box-shadow: 0 5px 0 var(--crimson-dark);
  }
  .btn-red:active {
    box-shadow: 0 2px 0 var(--crimson-dark);
  }

  .btn-green {
    background: var(--pine);
    color: #fff;
    border-color: var(--pine-dark);
    box-shadow: 0 5px 0 var(--pine-dark);
  }
  .btn-green:active {
    box-shadow: 0 2px 0 var(--pine-dark);
  }

  .btn-gold {
    background: #FDE68A;
    color: #781014;
    border-color: #B45309;
    box-shadow: 0 5px 0 #92400E;
  }
  .btn-gold:active {
    box-shadow: 0 2px 0 #92400E;
  }

  .btn-back {
    background: #FFFDF9;
    color: var(--ink);
    border-color: var(--pine);
    box-shadow: 0 5px 0 var(--pine-dark);
    margin-bottom: 16px;
  }
  .btn-back:active {
    box-shadow: 0 2px 0 var(--pine-dark);
  }

  /* Botones medianos 3D para Acciones de Usuario y Organización (Nada de botones cuadrados planos) */
  .btn-3d-pill {
    padding: 11px 16px;
    border-radius: 16px;
    font-size: 0.86rem;
    font-weight: 800;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    border: 2.5px solid var(--pine);
    background: #FFFDF9;
    color: var(--pine);
    box-shadow: 0 4px 0 var(--pine-dark);
    transition: transform 0.08s, box-shadow 0.08s;
    font-family: inherit;
    text-align: center;
    line-height: 1.2;
  }
  .btn-3d-pill:active {
    transform: translateY(3px);
    box-shadow: 0 1px 0 var(--pine-dark);
  }
  .btn-3d-pill.red {
    background: #FFF5F5;
    color: var(--crimson);
    border-color: var(--crimson);
    box-shadow: 0 4px 0 var(--crimson-dark);
  }
  .btn-3d-pill.red:active {
    box-shadow: 0 1px 0 var(--crimson-dark);
  }
  .btn-3d-pill.red-solid {
    background: var(--crimson);
    color: #fff;
    border-color: var(--crimson-dark);
    box-shadow: 0 4px 0 var(--crimson-dark);
  }
  .btn-3d-pill.green-solid {
    background: var(--pine);
    color: #fff;
    border-color: var(--pine-dark);
    box-shadow: 0 4px 0 var(--pine-dark);
  }
  .btn-3d-pill.gold {
    background: var(--gold-light);
    color: #781014;
    border-color: #B45309;
    box-shadow: 0 4px 0 #92400E;
  }
  .btn-3d-pill.gold:active {
    box-shadow: 0 1px 0 #92400E;
  }

  /* Etiquetas de sección */
  .section-label {
    font-family: 'Mountains of Christmas', Georgia, serif;
    font-size: 1.4rem;
    font-weight: 700;
    color: var(--pine);
    margin: 4px 0 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }

  .divider-ready {
    margin: 22px 0 12px;
    padding-top: 14px;
    border-top: 2px dashed var(--border);
    font-size: 0.8rem;
    font-weight: 800;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    text-align: center;
  }

  /* Cuadrícula de Participantes (2 columnas en móvil, botones grandes) */
  .grid-users {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
  }

  .user-card {
    background: #fff;
    border: 2.5px solid var(--pine);
    border-radius: 18px;
    padding: 15px 10px;
    text-align: center;
    cursor: pointer;
    box-shadow: 0 4px 0 var(--pine-dark);
    transition: transform 0.08s;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 7px;
    position: relative;
    font-family: inherit;
  }
  .user-card:active {
    transform: translateY(3px);
    box-shadow: 0 1px 0 var(--pine-dark);
  }

  /* Los que faltan por elegir (ARRIBA DEL TODO, borde rojo vivo) */
  .user-card.unclaimed {
    background: #FFFDF9;
    border-color: var(--crimson);
    box-shadow: 0 5px 0 var(--crimson-dark);
  }

  /* Los que ya tienen PIN (ABAJO DEL TODO, estilo pino) */
  .user-card.claimed {
    background: var(--paper-dark);
    border-color: #7D9285;
    box-shadow: 0 3px 0 #5C6E63;
  }

  .avatar-circle {
    width: 50px;
    height: 50px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.35rem;
    font-weight: 800;
    color: #fff;
    background: var(--crimson);
    border: 2.5px solid #fff;
    box-shadow: 0 3px 8px rgba(0,0,0,0.22);
    overflow: hidden;
    position: relative;
    flex-shrink: 0;
  }
  .user-card.claimed .avatar-circle {
    background: var(--pine);
  }
  .avatar-circle.has-photo {
    background: #FFFFFF !important;
  }
  .avatar-circle img.celeb-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center 12%;
    transform: scale(1.18);
    background: #FFFFFF;
    border-radius: 50%;
    display: block;
  }
  .avatar-circle img.celeb-img.is-crest {
    object-fit: contain;
    object-position: center center;
    transform: scale(0.86);
    padding: 3px;
    background: #FFFFFF;
  }
  .avatar-circle img.celeb-img.is-flag {
    object-fit: cover;
    object-position: center center;
    transform: scale(1.02);
    background: #FFFFFF;
  }

  /* Pestañas de Carpetas de Avatares */
  .folder-tabs {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin: 10px 0 12px;
  }
  .folder-tab-btn {
    padding: 8px 11px;
    border-radius: 12px;
    border: 2px solid var(--pine);
    background: #fff;
    color: var(--pine);
    font-weight: 800;
    font-size: 0.76rem;
    cursor: pointer;
    box-shadow: 0 3px 0 var(--pine-dark);
    font-family: inherit;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    transition: transform 0.08s;
  }
  .folder-tab-btn:active {
    transform: translateY(2px);
  }
  .folder-tab-btn.active {
    background: var(--crimson);
    border-color: var(--crimson-dark);
    color: #fff;
    box-shadow: 0 3px 0 var(--crimson-dark);
  }

  /* Galería de Avatares (Foto tipo carnet fondo blanco) */
  .celeb-picker-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin: 12px 0;
  }
  @media (min-width: 440px) {
    .celeb-picker-grid {
      grid-template-columns: repeat(4, 1fr);
    }
  }
  .celeb-card-btn {
    background: #fff;
    border: 2.5px solid var(--border);
    border-radius: 16px;
    padding: 10px 6px 8px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    box-shadow: 0 4px 0 var(--border);
    transition: transform 0.08s, box-shadow 0.08s, border-color 0.1s;
    font-family: inherit;
  }
  .celeb-card-btn:active {
    transform: translateY(3px);
    box-shadow: 0 1px 0 var(--border);
  }
  .celeb-card-btn.selected {
    border-color: var(--crimson);
    background: var(--gold-light);
    box-shadow: 0 4px 0 var(--crimson-dark);
  }
  .celeb-card-btn .avatar-circle {
    width: 62px;
    height: 62px;
    border: 2.5px solid var(--gold);
    background: #FFFFFF;
  }
  .celeb-card-name {
    font-size: 0.73rem;
    font-weight: 800;
    color: var(--ink);
    line-height: 1.15;
    text-align: center;
  }

  .user-name {
    font-weight: 800;
    font-size: 1.05rem;
    color: var(--ink);
    line-height: 1.2;
  }

  .status-tag {
    font-size: 0.72rem;
    font-weight: 800;
    padding: 3px 9px;
    border-radius: 8px;
  }
  .tag-new {
    background: #FEE2E2;
    color: var(--crimson);
  }
  .tag-locked {
    background: #DCFCE7;
    color: var(--pine);
  }

  /* Teclado Numérico de PIN */
  .pin-box {
    background: #fff;
    border: 2.5px solid var(--gold);
    border-radius: 20px;
    padding: 18px 14px;
    text-align: center;
    box-shadow: 0 6px 18px rgba(0,0,0,0.06);
  }

  .pin-dots {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin: 16px 0;
  }

  .pin-dot {
    width: 50px;
    height: 56px;
    border: 2.5px solid var(--pine);
    border-radius: 14px;
    background: var(--paper);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.7rem;
    font-weight: 800;
    color: var(--crimson);
  }
  .pin-dot.filled {
    background: var(--gold-light);
    border-color: var(--crimson);
  }

  .keypad {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    max-width: 310px;
    margin: 0 auto;
  }

  .key-btn {
    padding: 15px 0;
    font-size: 1.35rem;
    font-weight: 800;
    border-radius: 14px;
    border: 2px solid var(--border);
    background: var(--paper);
    color: var(--ink);
    cursor: pointer;
    box-shadow: 0 3px 0 var(--border);
    font-family: inherit;
  }
  .key-btn:active {
    transform: translateY(2px);
    box-shadow: none;
  }

  /* Contador de Marcha Atrás en Tiempo Real */
  .countdown-banner {
    background: linear-gradient(145deg, var(--pine), var(--pine-dark));
    color: #fff;
    border-radius: 20px;
    padding: 18px 14px;
    text-align: center;
    border: 2.5px solid var(--gold);
    margin-bottom: 16px;
    box-shadow: 0 8px 20px rgba(12,43,28,0.25);
  }
  .countdown-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin-top: 12px;
  }
  .cd-unit {
    background: rgba(255,255,255,0.12);
    padding: 10px 4px;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.22);
  }
  .cd-num {
    font-size: 1.55rem;
    font-weight: 800;
    color: #FDE68A;
    display: block;
    line-height: 1.1;
  }
  .cd-lbl {
    font-size: 0.68rem;
    text-transform: uppercase;
    opacity: 0.9;
    font-weight: 700;
  }

  /* Sobre Lacrado para Desvelar */
  .envelope-box {
    background: linear-gradient(160deg, #A3181E, #6E0E12);
    border: 3px solid var(--gold);
    border-radius: 22px;
    padding: 24px 16px;
    color: #fff;
    text-align: center;
    box-shadow: 0 10px 24px rgba(184,29,36,0.3);
    margin-bottom: 18px;
  }

  .wax-seal {
    width: 78px;
    height: 78px;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #FBBF24, #B45309);
    border: 3px dashed #FEF3C7;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2.2rem;
    margin: 12px auto;
    box-shadow: 0 5px 15px rgba(0,0,0,0.45);
  }

  /* Menú Principal del Usuario: 4 Botones 3D Grandes en UNA SOLA LÍNEA */
  .user-tabs {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin-bottom: 18px;
  }
  .tab-btn {
    padding: 12px 6px 10px;
    border-radius: 18px;
    border: 2.5px solid var(--pine);
    background: #FFFDF9;
    color: var(--ink);
    font-weight: 800;
    font-size: 0.76rem;
    line-height: 1.15;
    cursor: pointer;
    text-align: center;
    box-shadow: 0 5px 0 var(--pine-dark);
    font-family: inherit;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
    transition: transform 0.08s, box-shadow 0.08s;
  }
  .tab-btn:active {
    transform: translateY(3px);
    box-shadow: 0 2px 0 var(--pine-dark);
  }
  .tab-btn .tab-icon-badge {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: var(--paper-dark);
    border: 2.5px solid var(--pine);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.25rem;
    overflow: hidden;
    flex-shrink: 0;
    box-shadow: 0 2px 5px rgba(0,0,0,0.12);
  }
  .tab-btn .tab-sub-pill {
    font-size: 0.65rem;
    font-weight: 800;
    padding: 3px 7px;
    border-radius: 99px;
    background: var(--paper-dark);
    color: var(--pine);
    border: 1.5px solid var(--border);
    max-width: 100%;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .tab-btn.active {
    background: var(--crimson);
    border-color: var(--crimson-dark);
    color: #fff;
    box-shadow: 0 5px 0 var(--crimson-dark);
  }
  .tab-btn.active:active {
    box-shadow: 0 2px 0 var(--crimson-dark);
  }
  .tab-btn.active .tab-icon-badge {
    background: #fff;
    border-color: var(--gold);
  }
  .tab-btn.active .tab-sub-pill {
    background: #FDE68A;
    color: #781014;
    border-color: #B45309;
  }

  /* Barra Superior de Sesión del Participante */
  .user-session-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
    background: #FFFDF9;
    padding: 10px 14px;
    border-radius: 18px;
    border: 2.5px solid var(--gold);
    box-shadow: 0 4px 0 #DFC89C;
    gap: 10px;
  }

  /* Artículos de Lista de Deseos */
  .wish-item {
    background: #fff;
    border: 2.5px solid var(--border);
    border-radius: 16px;
    padding: 13px 14px;
    margin-bottom: 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    box-shadow: 0 3px 0 #E5DAC6;
  }
  .input-christmas {
    width: 100%;
    padding: 13px 14px;
    border-radius: 14px;
    border: 2.5px solid var(--border);
    font-size: 0.95rem;
    font-weight: 700;
    margin-bottom: 8px;
    font-family: inherit;
    background: #fff;
    color: var(--ink);
  }
  .input-christmas:focus {
    outline: none;
    border-color: var(--pine);
  }

  /* Banner de Bienvenida al Unirse */
  .welcome-banner {
    background: #ECFDF5;
    border: 2.5px solid var(--pine);
    color: var(--pine-dark);
    padding: 13px 14px;
    border-radius: 16px;
    margin-bottom: 14px;
    font-size: 0.9rem;
    font-weight: 700;
    line-height: 1.35;
    box-shadow: 0 4px 0 #A7F3D0;
  }

  /* Tarjetas y Botones 3D del Panel Admin (Cero botones cuadrados feos) */
  .admin-section {
    background: #fff;
    border: 2.5px solid var(--border);
    border-radius: 20px;
    padding: 16px;
    margin-bottom: 16px;
    box-shadow: 0 5px 0 #E5DAC6;
  }
  .admin-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px;
    margin-bottom: 10px;
    background: var(--paper);
    border: 2px solid var(--border);
    border-radius: 16px;
    gap: 10px;
    flex-wrap: wrap;
  }

  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(() => el.classList.remove('show'), 3200);
}

function getCountdownParts(isoDate) {
  const target = new Date(isoDate).getTime();
  const now = Date.now();
  const diff = Math.max(0, target - now);
  const days = String(Math.floor(diff / (1000 * 60 * 60 * 24))).padStart(2, '0');
  const hours = String(Math.floor((diff / (1000 * 60 * 60)) % 24)).padStart(2, '0');
  const mins = String(Math.floor((diff / 1000 / 60) % 60)).padStart(2, '0');
  const secs = String(Math.floor((diff / 1000) % 60)).padStart(2, '0');
  return { days, hours, mins, secs };
}

      const extraClass = celeb.kind === 'crest' ? 'is-crest' : (celeb.kind === 'flag' ? 'is-flag' : 'is-face');
      return `<img class="celeb-img ${extraClass}" src="${wikiUrl}" alt="${celeb.name}" onerror="this.onerror=null;this.src='${fallbackUri}';" />`;
    }
    if (av.startsWith('http://') || av.startsWith('https://') || av.startsWith('data:image')) {
      return `<img class="celeb-img" src="${av}" alt="Avatar" />`;
    }
    return av;
  }
  const cleanName = (person?.name || '?').trim();
  return cleanName.charAt(0).toUpperCase();
}

// Renderiza el bloque reutilizable de carpetas + cuadrícula de avatares
function buildCategorizedAvatarPickerHtml(selectedAvatarId, clickHandlerName, userIdArg = null) {
  const folderButtons = AVATAR_FOLDERS.map(f => `
    <button type="button" class="folder-tab-btn ${activeAvatarFolder === f.id ? 'active' : ''}" onclick="window.app.setAvatarFolder('${f.id}')">
      <span>${f.label}</span>
    </button>
  `).join('');

  const itemsInFolder = SPANISH_CELEBS.filter(c => c.folder === activeAvatarFolder);

  const cardsHtml = itemsInFolder.map(celeb => {
    const wikiUrl = `https://commons.wikimedia.org/wiki/Special:FilePath/${celeb.wiki}?width=280`;
    const fallbackUri = buildCelebFallbackDataUri(celeb);
    const extraClass = celeb.kind === 'crest' ? 'is-crest' : (celeb.kind === 'flag' ? 'is-flag' : 'is-face');
    const onClickCall = userIdArg
      ? `window.app.${clickHandlerName}('${userIdArg}', '${celeb.id}')`
      : `window.app.${clickHandlerName}('${celeb.id}')`;

    return `
      <button type="button" class="celeb-card-btn ${selectedAvatarId === celeb.id ? 'selected' : ''}" onclick="${onClickCall}">
        <div class="avatar-circle has-photo">
          <img class="celeb-img ${extraClass}" src="${wikiUrl}" alt="${celeb.name}" onerror="this.onerror=null;this.src='${fallbackUri}';" />
        </div>
        <span class="celeb-card-name">${celeb.name}</span>
      </button>
    `;
  }).join('');

  return `
    <div class="folder-tabs">${folderButtons}</div>
    <div class="celeb-picker-grid">${cardsHtml}</div>
  `;
}

function getCelebNameLabel(avatarId, personName) {
  if (!avatarId) return `Inicial (${(personName || '?').trim().charAt(0).toUpperCase()})`;
  const celeb = SPANISH_CELEBS.find(c => c.id === avatarId);
  return celeb ? celeb.name : 'Foto personalizada';
}

// Registra un sorteo en la "Mochila" del usuario para vincular sus sorteos sin registro
function rememberInMyBag(draw, user) {
  if (!draw || !user) return;
  const exists = myBag.some(item => item.drawId === draw.id && item.userName.toLowerCase() === user.name.toLowerCase());
  if (!exists) {
    myBag.push({
      drawId: draw.id,
      userName: user.name,
      familyCode: draw.familyCode || draw.id
    });
    localStorage.setItem(MY_BAG_KEY, JSON.stringify(myBag));
  }
}

// Encuentra todos los sorteos vinculados a este usuario (por Mochila, por Código de Familia o por coincidencia de Nombre + mismo PIN)
function getLinkedDrawsForUser(currentUserObj, currentDrawObj) {
  if (!currentUserObj) return [];
  const uName = currentUserObj.name.trim().toLowerCase();
  const uPin = currentUserObj.pin;
  const currentFam = (currentDrawObj?.familyCode || '').trim().toUpperCase();

  return draws.filter(d => {
    // 1. Mismo código de familia (ej. Histórico de otros años de FAM-RODRIGO)
    if (currentFam && (d.familyCode || '').trim().toUpperCase() === currentFam) return true;
    // 2. Está guardado en su Mochila del navegador
    if (myBag.some(b => b.drawId === d.id || (b.familyCode && b.familyCode === d.familyCode))) return true;
    // 3. Tiene el mismo nombre y el mismo PIN de 4 dígitos en otro grupo (ej. Marcos con PIN 1234 en Familia y en Amigos)
    if (uPin && d.participants.some(p => p.name.trim().toLowerCase() === uName && p.pin === uPin)) return true;
    return false;
  });
}
