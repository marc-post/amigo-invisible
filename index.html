<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Amigo Invisible Familiar</title>
<!-- Fuentes navideñas con carga asíncrona no bloqueante (apertura instantánea) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Berkshire+Swash&family=Mountains+of+Christmas:wght@700&family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">

<style>
  :root {
    --paper: #FBF7F0;
    --paper-dark: #F2E8D5;
    --crimson: #B81D24;
    --crimson-dark: #821015;
    --pine: #164A31;
    --pine-dark: #0C2B1C;
    --gold: #C8963E;
    --gold-light: #FDF3DF;
    --ink: #231F20;
    --muted: #6B6257;
    --border: #D9CCB8;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
  }

  /* Reset limpio para eliminar botones e inputs cuadrados por defecto del navegador */
  button, input, select, textarea {
    font-family: inherit;
    appearance: none;
    -webkit-appearance: none;
  }

  body {
    background-color: #113221;
    background-image:
      radial-gradient(#1f5438 1.5px, transparent 1.5px),
      radial-gradient(#19422c 1.5px, #113221 1.5px);
    background-size: 28px 28px;
    background-position: 0 0, 14px 14px;
    font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: var(--ink);
    min-height: 100vh;
    padding: 12px;
    display: flex;
    justify-content: center;
    align-items: flex-start;
  }

  /* Contenedor principal tipo Postal Navideña */
  .postcard {
    width: 100%;
    max-width: 600px;
    background: var(--paper);
    border-radius: 26px;
    border: 3px solid var(--gold);
    box-shadow: 0 16px 40px rgba(0,0,0,0.48);
    overflow: hidden;
    position: relative;
    margin-bottom: 28px;
  }

  /* Franja clásica navideña */
  .airmail-stripe {
    height: 14px;
    background: repeating-linear-gradient(
      -45deg,
      var(--crimson),
      var(--crimson) 15px,
      var(--paper) 15px,
      var(--paper) 23px,
      var(--pine) 23px,
      var(--pine) 38px,
      var(--paper) 38px,
      var(--paper) 46px
    );
    border-bottom: 2px solid var(--gold);
  }
  .airmail-stripe.bottom {
    border-bottom: none;
    border-top: 2px solid var(--gold);
  }

  /* Cabecera limpia del Sorteo (Entrada directa desde WhatsApp) */
  .hero-header {
    text-align: center;
    padding: 22px 16px 18px;
    border-bottom: 2px dashed var(--border);
    position: relative;
    background: radial-gradient(circle at top, #FFFDF9 0%, var(--paper) 100%);
  }

  .christmas-title {
    font-family: 'Berkshire Swash', 'Mountains of Christmas', Georgia, serif;
    font-size: 2.2rem;
    color: var(--crimson);
    line-height: 1.15;
    text-shadow: 1px 2px 0px #F3D9B1;
    margin-bottom: 6px;
  }

  .meta-pills {
    display: flex;
    justify-content: center;
    gap: 8px;
    flex-wrap: wrap;
    margin-top: 10px;
  }

  .meta-pill {
    background: var(--pine);
    color: #fff;
    padding: 6px 13px;
    border-radius: 99px;
    font-size: 0.8rem;
    font-weight: 700;
  }
  .meta-pill.gold {
    background: var(--gold-light);
    color: var(--ink);
    border: 1.5px solid var(--gold);
  }

  .content {
    padding: 20px 16px 18px;
  }

  /* Pie de postal */
  .postal-footer {
    padding: 14px 16px 18px;
    text-align: center;
    border-top: 2px dashed var(--border);
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    background: rgba(242, 232, 213, 0.35);
  }
  .btn-stealth-admin {
    background: var(--paper-dark);
    border: 2px solid var(--border);
    color: var(--muted);
    font-size: 0.8rem;
    font-weight: 800;
    cursor: pointer;
    padding: 9px 18px;
    border-radius: 99px;
    box-shadow: 0 3px 0 var(--border);
    transition: transform 0.08s, box-shadow 0.08s, color 0.15s, border-color 0.15s;
  }
  .btn-stealth-admin:hover {
    color: var(--pine);
    border-color: var(--pine);
  }
  .btn-stealth-admin:active {
    transform: translateY(2px);
    box-shadow: 0 1px 0 var(--border);
  }

  /* Botones 3D Artesanales Grandes */
  .btn-big {
    width: 100%;
    padding: 15px 20px;
    border-radius: 20px;
    font-size: 1rem;
    font-weight: 800;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    transition: transform 0.08s, box-shadow 0.08s;
    border: 2.5px solid transparent;
    text-align: center;
    line-height: 1.25;
  }
  .btn-big:active {
    transform: translateY(3px);
  }

  .btn-red {
    background: var(--crimson);
    color: #fff;
    border-color: var(--crimson-dark);
    box-shadow: 0 5px 0 var(--crimson-dark);
  }
  .btn-red:active {
    box-shadow: 0 2px 0 var(--crimson-dark);
  }

  .btn-green {
    background: var(--pine);
    color: #fff;
    border-color: var(--pine-dark);
    box-shadow: 0 5px 0 var(--pine-dark);
  }
  .btn-green:active {
    box-shadow: 0 2px 0 var(--pine-dark);
  }

  .btn-gold {
    background: #FDE68A;
    color: #781014;
    border-color: #B45309;
    box-shadow: 0 5px 0 #92400E;
  }
  .btn-gold:active {
    box-shadow: 0 2px 0 #92400E;
  }

  .btn-back {
    background: #FFFDF9;
    color: var(--ink);
    border-color: var(--pine);
    box-shadow: 0 5px 0 var(--pine-dark);
    margin-bottom: 16px;
  }
  .btn-back:active {
    box-shadow: 0 2px 0 var(--pine-dark);
  }

  /* Botones píldora 3D redondeados para todas las acciones secundarias */
  .btn-3d-pill {
    padding: 10px 15px;
    border-radius: 99px;
    font-size: 0.84rem;
    font-weight: 800;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    border: 2.5px solid var(--pine);
    background: #FFFDF9;
    color: var(--pine);
    box-shadow: 0 4px 0 var(--pine-dark);
    transition: transform 0.08s, box-shadow 0.08s;
    text-align: center;
    line-height: 1.2;
  }
  .btn-3d-pill:active {
    transform: translateY(3px);
    box-shadow: 0 1px 0 var(--pine-dark);
  }
  .btn-3d-pill.red {
    background: #FFF5F5;
    color: var(--crimson);
    border-color: var(--crimson);
    box-shadow: 0 4px 0 var(--crimson-dark);
  }
  .btn-3d-pill.red:active {
    box-shadow: 0 1px 0 var(--crimson-dark);
  }
  .btn-3d-pill.red-solid {
    background: var(--crimson);
    color: #fff;
    border-color: var(--crimson-dark);
    box-shadow: 0 4px 0 var(--crimson-dark);
  }
  .btn-3d-pill.red-solid:active {
    box-shadow: 0 1px 0 var(--crimson-dark);
  }
  .btn-3d-pill.green-solid {
    background: var(--pine);
    color: #fff;
    border-color: var(--pine-dark);
    box-shadow: 0 4px 0 var(--pine-dark);
  }
  .btn-3d-pill.green-solid:active {
    box-shadow: 0 1px 0 var(--pine-dark);
  }
  .btn-3d-pill.gold {
    background: var(--gold-light);
    color: #781014;
    border-color: #B45309;
    box-shadow: 0 4px 0 #92400E;
  }
  .btn-3d-pill.gold:active {
    box-shadow: 0 1px 0 #92400E;
  }

  /* Bloque de siguiente paso guiado */
  .guided-next-box {
    margin-top: 20px;
    padding-top: 16px;
    border-top: 2px dashed var(--border);
  }

  /* Etiquetas de sección */
  .section-label {
    font-family: 'Mountains of Christmas', Georgia, serif;
    font-size: 1.45rem;
    font-weight: 700;
    color: var(--pine);
    margin: 2px 0 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }

  .divider-ready {
    margin: 22px 0 12px;
    padding-top: 14px;
    border-top: 2px dashed var(--border);
    font-size: 0.8rem;
    font-weight: 800;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    text-align: center;
  }

  /* Cuadrícula de Participantes (2 columnas en móvil) */
  .grid-users {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
  }

  .user-card {
    background: #fff;
    border: 2.5px solid var(--pine);
    border-radius: 20px;
    padding: 16px 10px;
    text-align: center;
    cursor: pointer;
    box-shadow: 0 4px 0 var(--pine-dark);
    transition: transform 0.08s;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 7px;
    position: relative;
  }
  .user-card:active {
    transform: translateY(3px);
    box-shadow: 0 1px 0 var(--pine-dark);
  }

  .user-card.unclaimed {
    background: #FFFDF9;
    border-color: var(--crimson);
    box-shadow: 0 5px 0 var(--crimson-dark);
  }

  .user-card.claimed {
    background: var(--paper-dark);
    border-color: #7D9285;
    box-shadow: 0 3px 0 #5C6E63;
  }

  /* Avatares circulares tipo carnet */
  .avatar-circle {
    width: 54px;
    height: 54px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.4rem;
    font-weight: 800;
    color: #fff;
    background: var(--crimson);
    border: 2.5px solid #fff;
    box-shadow: 0 3px 8px rgba(0,0,0,0.22);
    overflow: hidden;
    position: relative;
    flex-shrink: 0;
  }
  .user-card.claimed .avatar-circle {
    background: var(--pine);
  }
  .avatar-circle.has-photo {
    background: #FFFFFF !important;
  }
  .avatar-circle img.celeb-img,
  .tab-icon-badge img.celeb-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center 12%;
    transform: scale(1.18);
    background: #FFFFFF;
    border-radius: 50%;
    display: block;
  }
  .avatar-circle img.celeb-img.is-crest,
  .tab-icon-badge img.celeb-img.is-crest {
    object-fit: contain;
    object-position: center center;
    transform: scale(0.86);
    padding: 3px;
    background: #FFFFFF;
  }
  .avatar-circle img.celeb-img.is-flag,
  .tab-icon-badge img.celeb-img.is-flag {
    object-fit: cover;
    object-position: center center;
    transform: scale(1.02);
    background: #FFFFFF;
  }
  .tab-icon-badge.has-photo {
    background: #FFFFFF !important;
  }

  /* Pestañas de Carpetas de Avatares */
  .folder-tabs {
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
    margin: 10px 0 14px;
  }
  .folder-tab-btn {
    padding: 8px 13px;
    border-radius: 99px;
    border: 2px solid var(--pine);
    background: #fff;
    color: var(--pine);
    font-weight: 800;
    font-size: 0.78rem;
    cursor: pointer;
    box-shadow: 0 3px 0 var(--pine-dark);
    display: inline-flex;
    align-items: center;
    gap: 5px;
    transition: transform 0.08s;
  }
  .folder-tab-btn:active {
    transform: translateY(2px);
  }
  .folder-tab-btn.active {
    background: var(--crimson);
    border-color: var(--crimson-dark);
    color: #fff;
    box-shadow: 0 3px 0 var(--crimson-dark);
  }

  /* Galería de Avatares */
  .celeb-picker-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin: 12px 0;
  }
  @media (min-width: 440px) {
    .celeb-picker-grid {
      grid-template-columns: repeat(4, 1fr);
    }
  }
  .celeb-card-btn {
    background: #fff;
    border: 2.5px solid var(--border);
    border-radius: 18px;
    padding: 10px 6px 8px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    box-shadow: 0 4px 0 var(--border);
    transition: transform 0.08s, box-shadow 0.08s, border-color 0.1s;
  }
  .celeb-card-btn:active {
    transform: translateY(3px);
    box-shadow: 0 1px 0 var(--border);
  }
  .celeb-card-btn.selected {
    border-color: var(--crimson);
    background: var(--gold-light);
    box-shadow: 0 4px 0 var(--crimson-dark);
  }
  .celeb-card-btn .avatar-circle {
    width: 62px;
    height: 62px;
    border: 2.5px solid var(--gold);
    background: #FFFFFF;
  }
  .celeb-card-name {
    font-size: 0.73rem;
    font-weight: 800;
    color: var(--ink);
    line-height: 1.15;
    text-align: center;
  }

  .user-name {
    font-weight: 800;
    font-size: 1.05rem;
    color: var(--ink);
    line-height: 1.2;
  }

  .status-tag {
    font-size: 0.72rem;
    font-weight: 800;
    padding: 4px 10px;
    border-radius: 99px;
    display: inline-block;
  }
  .tag-new {
    background: #FEE2E2;
    color: var(--crimson);
  }
  .tag-locked {
    background: #DCFCE7;
    color: var(--pine);
  }

  /* Teclado Numérico de PIN */
  .pin-box {
    background: #fff;
    border: 2.5px solid var(--gold);
    border-radius: 22px;
    padding: 20px 14px;
    text-align: center;
    box-shadow: 0 6px 18px rgba(0,0,0,0.06);
  }

  .pin-dots {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin: 16px 0;
  }

  .pin-dot {
    width: 50px;
    height: 56px;
    border: 2.5px solid var(--pine);
    border-radius: 16px;
    background: var(--paper);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.7rem;
    font-weight: 800;
    color: var(--crimson);
  }
  .pin-dot.filled {
    background: var(--gold-light);
    border-color: var(--crimson);
  }

  .keypad {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    max-width: 310px;
    margin: 0 auto;
  }

  .key-btn {
    padding: 15px 0;
    font-size: 1.35rem;
    font-weight: 800;
    border-radius: 16px;
    border: 2px solid var(--border);
    background: var(--paper);
    color: var(--ink);
    cursor: pointer;
    box-shadow: 0 3px 0 var(--border);
  }
  .key-btn:active {
    transform: translateY(2px);
    box-shadow: none;
  }

  /* Contador de Marcha Atrás */
  .countdown-banner {
    background: linear-gradient(145deg, var(--pine), var(--pine-dark));
    color: #fff;
    border-radius: 20px;
    padding: 18px 14px;
    text-align: center;
    border: 2.5px solid var(--gold);
    margin-bottom: 16px;
    box-shadow: 0 8px 20px rgba(12,43,28,0.25);
  }
  .countdown-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin-top: 12px;
  }
  .cd-unit {
    background: rgba(255,255,255,0.12);
    padding: 10px 4px;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.22);
  }
  .cd-num {
    font-size: 1.55rem;
    font-weight: 800;
    color: #FDE68A;
    display: block;
    line-height: 1.1;
  }
  .cd-lbl {
    font-size: 0.68rem;
    text-transform: uppercase;
    opacity: 0.9;
    font-weight: 700;
  }

  /* Sobre Lacrado para Desvelar */
  .envelope-box {
    background: linear-gradient(160deg, #A3181E, #6E0E12);
    border: 3px solid var(--gold);
    border-radius: 22px;
    padding: 24px 16px;
    color: #fff;
    text-align: center;
    box-shadow: 0 10px 24px rgba(184,29,36,0.3);
    margin-bottom: 18px;
  }

  .wax-seal {
    width: 78px;
    height: 78px;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #FBBF24, #B45309);
    border: 3px dashed #FEF3C7;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2.2rem;
    margin: 12px auto;
    box-shadow: 0 5px 15px rgba(0,0,0,0.45);
  }

  /* Menú Principal del Usuario: 4 Botones 3D en UNA SOLA LÍNEA */
  .user-tabs {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin-bottom: 18px;
  }
  .tab-btn {
    padding: 11px 5px 10px;
    border-radius: 18px;
    border: 2.5px solid var(--pine);
    background: #FFFDF9;
    color: var(--ink);
    font-weight: 800;
    font-size: 0.74rem;
    line-height: 1.15;
    cursor: pointer;
    text-align: center;
    box-shadow: 0 5px 0 var(--pine-dark);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
    transition: transform 0.08s, box-shadow 0.08s;
  }
  .tab-btn:active {
    transform: translateY(3px);
    box-shadow: 0 2px 0 var(--pine-dark);
  }
  .tab-btn .tab-icon-badge {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: var(--paper-dark);
    border: 2.5px solid var(--pine);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.2rem;
    overflow: hidden;
    flex-shrink: 0;
    box-shadow: 0 2px 5px rgba(0,0,0,0.12);
  }
  .tab-btn .tab-sub-pill {
    font-size: 0.64rem;
    font-weight: 800;
    padding: 3px 7px;
    border-radius: 99px;
    background: var(--paper-dark);
    color: var(--pine);
    border: 1.5px solid var(--border);
    max-width: 100%;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .tab-btn.active {
    background: var(--crimson);
    border-color: var(--crimson-dark);
    color: #fff;
    box-shadow: 0 5px 0 var(--crimson-dark);
  }
  .tab-btn.active:active {
    box-shadow: 0 2px 0 var(--crimson-dark);
  }
  .tab-btn.active .tab-icon-badge {
    background: #fff;
    border-color: var(--gold);
  }
  .tab-btn.active .tab-sub-pill {
    background: #FDE68A;
    color: #781014;
    border-color: #B45309;
  }

  /* Barra Superior de Sesión del Participante */
  .user-session-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
    background: #FFFDF9;
    padding: 10px 14px;
    border-radius: 20px;
    border: 2.5px solid var(--gold);
    box-shadow: 0 4px 0 #DFC89C;
    gap: 10px;
  }

  /* Artículos de Lista de Deseos */
  .wish-item {
    background: #fff;
    border: 2.5px solid var(--border);
    border-radius: 18px;
    padding: 14px;
    margin-bottom: 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    box-shadow: 0 3px 0 #E5DAC6;
    flex-wrap: wrap;
  }
  .nowish-item {
    background: #FFF5F5;
    border: 2.5px solid #F3B8BC;
    border-radius: 18px;
    padding: 12px 14px;
    margin-bottom: 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    box-shadow: 0 3px 0 #F1D0D2;
  }
  .wish-link-anchor {
    text-decoration: none;
    margin-top: 6px;
    padding: 7px 12px;
    font-size: 0.78rem;
  }

  /* Formularios con aire y bordes redondeados */
  .field-group {
    margin-bottom: 14px;
    text-align: left;
  }
  .field-label {
    display: block;
    font-size: 0.8rem;
    font-weight: 800;
    color: var(--pine);
    margin-bottom: 6px;
    padding-left: 4px;
  }
  .field-grid-2 {
    display: grid;
    grid-template-columns: 1fr;
    gap: 12px;
    margin-bottom: 14px;
  }
  @media (min-width: 440px) {
    .field-grid-2 {
      grid-template-columns: 1fr 1fr;
    }
  }
  .input-christmas {
    width: 100%;
    padding: 13px 15px;
    border-radius: 16px;
    border: 2.5px solid var(--border);
    font-size: 0.94rem;
    font-weight: 700;
    background: #FFFDF9;
    color: var(--ink);
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .input-christmas:focus {
    outline: none;
    border-color: var(--pine);
    box-shadow: 0 0 0 3px rgba(22, 74, 49, 0.12);
    background: #fff;
  }
  select.input-christmas {

function buildCelebFallbackDataUri(celeb) {
  const parts = celeb.name.split(' ');
  const ini = (parts[0][0] + (parts[1] ? parts[1][0] : '')).toUpperCase();
  const color = celeb.accent || '#B81D24';
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
    <rect width="120" height="120" fill="#FFFFFF"/>
    <circle cx="60" cy="44" r="28" fill="#F6D5B0" stroke="${color}" stroke-width="3"/>
    <circle cx="50" cy="40" r="3" fill="#231F20"/>
    <circle cx="70" cy="40" r="3" fill="#231F20"/>
    <path d="M52 52 Q60 58 68 52" fill="none" stroke="#821015" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M18 120 C18 82 102 82 102 120 Z" fill="${color}"/>
    <text x="60" y="109" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="18" fill="#FFFFFF">${ini}</text>
  </svg>`;
  return 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
}

function safeReadJson(key, fallback) {
  try {
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : fallback;
  } catch (e) {
    return fallback;
  }
}

function escapeHtml(str) {
  return String(str ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function generateSecureDrawId() {
  const chars = 'abcdefghijklmnopqrstuvwxyz0123456789';
  const bytes = new Uint8Array(20);
  if (window.crypto && window.crypto.getRandomValues) {
    window.crypto.getRandomValues(bytes);
  } else {
    for (let i = 0; i < bytes.length; i++) bytes[i] = Math.floor(Math.random() * 256);
  }
  let id = 's_';
  for (let i = 0; i < bytes.length; i++) id += chars[bytes[i] % chars.length];
  return id;
}

// Obtiene pares históricos (nombre -> nombre) de otros sorteos con el mismo Código de Familia
function getPreviousYearPairsForDraw(draw) {
  if (!draw || !draw.familyCode) return [];
  const fam = draw.familyCode.trim().toUpperCase();
  if (!fam) return [];
  const pairs = [];
  draws.forEach(other => {
    if (other.id === draw.id) return;
    if ((other.familyCode || '').trim().toUpperCase() !== fam) return;
    (other.participants || []).forEach(p => {
      if (!p.targetId) return;
      const target = (other.participants || []).find(t => t.id === p.targetId);
      if (target) {
        pairs.push({
          giverName: p.name.trim().toLowerCase(),
          receiverName: target.name.trim().toLowerCase(),
          giverDisplay: p.name,
          receiverDisplay: target.name,
          sourceTitle: other.title
        });
      }
    });
  });
  return pairs;
}

function getCountdownParts(isoDate) {
  const target = new Date(isoDate).getTime();
  if (Number.isNaN(target)) {
    return { days: '00', hours: '00', mins: '00', secs: '00' };
  }
  const now = Date.now();
  const diff = Math.max(0, target - now);
  const days = String(Math.floor(diff / (1000 * 60 * 60 * 24))).padStart(2, '0');
  const hours = String(Math.floor((diff / (1000 * 60 * 60)) % 24)).padStart(2, '0');
  const mins = String(Math.floor((diff / 1000 / 60) % 60)).padStart(2, '0');
  const secs = String(Math.floor((diff / 1000) % 60)).padStart(2, '0');
  return { days, hours, mins, secs };
}

function getCelebImageUrl(celeb) {
  if (!celeb) return '';
  if (celeb.url) return celeb.url;
  if (celeb.wiki) return `https://commons.wikimedia.org/wiki/Special:FilePath/${celeb.wiki}?width=300`;
  return buildCelebFallbackDataUri(celeb);
}

function getAvatarDisplay(person) {
  const av = person && person.avatar ? String(person.avatar).trim() : '';
  if (av) {
    const celeb = SPANISH_CELEBS.find(c => c.id === av);
    if (celeb) {
      const imgUrl = getCelebImageUrl(celeb);
      const fallbackUri = buildCelebFallbackDataUri(celeb);
      const extraClass = celeb.kind === 'crest' ? 'is-crest' : (celeb.kind === 'flag' ? 'is-flag' : 'is-face');
      return `<img class="celeb-img ${extraClass}" src="${escapeHtml(imgUrl)}" alt="${escapeHtml(celeb.name)}" onerror="this.onerror=null;this.src='${fallbackUri}';" />`;
    }
    if (av.startsWith('http://') || av.startsWith('https://') || av.startsWith('data:image')) {
      return `<img class="celeb-img" src="${escapeHtml(av)}" alt="Avatar" />`;
    }
    return escapeHtml(av);
  }
  const cleanName = (person?.name || '?').trim();
  return escapeHtml(cleanName.charAt(0).toUpperCase());
}

function buildCategorizedAvatarPickerHtml(selectedAvatarId, clickHandlerName, userIdArg = null) {
  const folderButtons = AVATAR_FOLDERS.map(f => `

      <span>${f.label}</span>
    </button>
  `).join('');

  const itemsInFolder = SPANISH_CELEBS.filter(c => c.folder === activeAvatarFolder);

  const cardsHtml = itemsInFolder.map(celeb => {
    const imgUrl = getCelebImageUrl(celeb);
    const fallbackUri = buildCelebFallbackDataUri(celeb);
    const extraClass = celeb.kind === 'crest' ? 'is-crest' : (celeb.kind === 'flag' ? 'is-flag' : 'is-face');
    const onClickCall = userIdArg
      ? `window.app.${clickHandlerName}('${userIdArg}', '${celeb.id}')`
      : `window.app.${clickHandlerName}('${celeb.id}')`;

    return `
      <button type="button" class="celeb-card-btn ${selectedAvatarId === celeb.id ? 'selected' : ''}" onclick="${onClickCall}">
        <div class="avatar-circle has-photo">
          <img class="celeb-img ${extraClass}" src="${imgUrl}" alt="${celeb.name}" onerror="this.onerror=null;this.src='${fallbackUri}';" />
        </div>
        <span class="celeb-card-name">${celeb.name}</span>
      </button>
    `;
  }).join('');

  return `
    <div class="folder-tabs">${folderButtons}</div>
    <div class="celeb-picker-grid">${cardsHtml}</div>
  `;
}

    if (myBag.some(b => b.drawId === d.id || (b.familyCode && dFam && b.familyCode.trim().toUpperCase() === dFam))) return true;
    if (uPin && (d.participants || []).some(p => p.name.trim().toLowerCase() === uName && p.pin === uPin)) return true;
    return false;
  });
}

async function initCloudStorage() {
  try {
    const firebaseConfig = (typeof __firebase_config !== 'undefined' && __firebase_config)
      ? JSON.parse(__firebase_config)
      : {
          apiKey: "AIzaSyDeUXZGx3CorQYKM2MzdkaKCiw0JXbtSlw",
          authDomain: "amigo-invisible-8a0c3.firebaseapp.com",
          projectId: "amigo-invisible-8a0c3",
          storageBucket: "amigo-invisible-8a0c3.firebasestorage.app",
          messagingSenderId: "578227364812",
          appId: "1:578227364812:web:b30984cdc70e79ef0af369",
          measurementId: "G-RCZSNWS27B"
        };

    const app = initializeApp(firebaseConfig);
    auth = getAuth(app);
    db = getFirestore(app);
    stateDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'sorteos', 'estado_global');

    onAuthStateChanged(auth, (user) => {
      currentUser = user;
      if (!user) return;
      onSnapshot(stateDocRef, (snap) => {
        cloudLoaded = true;
        cloudStatus = 'connected';
        cloudErrorMsg = '';
        if (snap.exists()) {
          const cloudData = snap.data();
          if (Array.isArray(cloudData.draws)) {
            draws = cloudData.draws;
            localStorage.setItem(LOCAL_BACKUP_KEY, JSON.stringify(draws));
          }
          if (cloudData.adminPinCode) {
            adminPinCode = String(cloudData.adminPinCode).trim();
            localStorage.setItem(ADMIN_PASS_KEY, adminPinCode);
          }
          // Prioridad al ?sorteo=ID del enlace de WhatsApp solo en la carga inicial (sin pisar cambios manuales)
          if (urlDrawId && !hasAppliedUrlDraw && draws.some(d => d.id === urlDrawId) && currentScreen !== 'admin') {
            currentDrawId = urlDrawId;
            hasAppliedUrlDraw = true;
          } else if (currentDrawId && !draws.some(d => d.id === currentDrawId)) {
            currentDrawId = null;
          }
          // No interrumpir al usuario ni al admin mientras teclean un PIN o rellenan un formulario
          if (currentScreen !== 'admin_login' && currentScreen !== 'pin' && !isUserTypingInForm()) {
            renderAll();
          }
        } else {
          saveState();
          if (currentScreen !== 'admin_login' && currentScreen !== 'pin' && !isUserTypingInForm()) {
            renderAll();
          }
        }
      }, (err) => {
        cloudLoaded = true;
        cloudStatus = 'error';
        cloudErrorMsg = err?.message || 'Sin permisos de lectura en Firestore';
        console.warn('Firestore snapshot error:', err);
        if (currentScreen !== 'admin_login' && currentScreen !== 'pin' && !isUserTypingInForm()) {
          renderAll();
        }
      });
    });

    if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
      await signInWithCustomToken(auth, __initial_auth_token);
    } else {
      await signInAnonymously(auth);
    }
  } catch (err) {
    cloudLoaded = true;
    cloudStatus = 'error';
    cloudErrorMsg = err?.message || 'Error de conexión con Firebase';
    console.warn('Modo copia local activo:', err);
  }
}

async function saveState() {
  localStorage.setItem(LOCAL_BACKUP_KEY, JSON.stringify(draws));
  localStorage.setItem(ADMIN_PASS_KEY, adminPinCode);
  if (db && stateDocRef && currentUser) {
    try {
      await setDoc(stateDocRef, {
        draws,
        adminPinCode,
        updatedAt: Date.now()
      }, { merge: true });
      cloudStatus = 'connected';
      cloudErrorMsg = '';
    } catch (e) {
      cloudStatus = 'error';
      cloudErrorMsg = e?.message || 'Error al guardar en Firestore';
      console.warn('Error al sincronizar con la nube:', e);
    }
  }
}

    user.pin = enteredPin;
    justJoinedWelcome = true;
    userTab = 'status';
    rememberInMyBag(draw, user);
    saveState();
    launchConfetti();
    currentScreen = 'dashboard';
    renderAll();
  } else if (user.pin === enteredPin) {
    justJoinedWelcome = false;
    userTab = 'status';
    rememberInMyBag(draw, user);

    bodyHtml = `

        </div>

        ${showWishUrlField ? `
          <div class="field-group">
            <label class="field-label">🔗 Enlace web del producto o tienda</label>
            <input id="wishUrl" type="url" class="input-christmas" placeholder="https://www.amazon.es/..." />
          </div>
        ` : ''}

        <button type="button" class="btn-big btn-red" onclick="window.app.addWish()">➕ Añadir a mi lista de deseos</button>
      </div>
      ${myWishesList}

      <div class="divider-ready" style="margin-top:24px;">🚫 Cosas que NO quiero o ya tengo suficientes</div>
      <div class="admin-section" style="border-color:#F3B8BC;background:#FFFDFD;">

          <label class="field-label" style="color:var(--crimson);">¿Qué prefieres que NO te regalen?</label>

        <button type="button" class="btn-big btn-gold" onclick="window.app.addNoWish()">🚫 Añadir a "No quiero / Ya tengo"</button>

      ${myNoWishesList}

      <div class="guided-next-box">
        <button type="button" class="btn-big btn-green" onclick="window.app.setUserTab('avatar')">
          🎨 Siguiente paso: Elegir Mi Avatar ➔

  /* --- PESTAÑA 3: MI AVATAR (Guía -> Mis Sorteos) --- */

    bodyHtml = `

            ${getAvatarDisplay(user)}

            <div style="font-weight:800;font-size:1rem;">${escapeHtml(user.name)}</div>
            <div style="font-size:0.82rem;color:var(--muted);">Actual: <strong>${escapeHtml(getCelebNameLabel(user.avatar, user.name))}</strong></div>

        </div>

        <button type="button" class="btn-3d-pill ${!user.avatar ? 'red-solid' : ''}" style="width:100%;margin-bottom:10px;" onclick="window.app.setMyAvatar(null)">
          🔤 Usar solo mi inicial (${escapeHtml(user.name.trim().charAt(0).toUpperCase())})
        </button>

        ${buildCategorizedAvatarPickerHtml(user.avatar, 'setMyAvatar')}
      </div>

      <div class="guided-next-box">
        <button type="button" class="btn-big btn-green" onclick="window.app.setUserTab('multisorteo')">
          📜 Siguiente paso: Ver Mis Sorteos ➔
        </button>
      </div>
    `;
  }

  /* --- PESTAÑA 4: MIS SORTEOS (Fin del recorrido guiado, sin botón siguiente) --- */
  if (userTab === 'multisorteo') {
    const activeLinked = linkedDraws.filter(d => d.status !== 'archived');
    const archivedLinked = linkedDraws.filter(d => d.status === 'archived');

    bodyHtml = `
      <div class="section-label">📜 Tus Sorteos Vinculados</div>
      <p style="font-size:0.84rem;color:var(--muted);margin-bottom:14px;">
        Aquí ves todos los grupos donde participas con tu nombre y PIN o los sorteos pasados de tu familia:
      </p>

      ${activeLinked.map(d => `
        <div class="wish-item" style="${d.id === draw.id ? 'border-color:var(--crimson);background:#FFFDF9;' : ''}">
          <div>
            <div style="font-weight:800;font-size:0.98rem;">🎄 ${escapeHtml(d.title)}</div>
            <div style="font-size:0.78rem;color:var(--muted);margin-top:2px;">
              ${escapeHtml(d.dateText || 'Sin fecha')} · Máx. ${escapeHtml(d.budget || '—')}
            </div>
          </div>
          ${d.id === draw.id
            ? `<span class="status-tag tag-locked">📍 Actual</span>`
            : `<button type="button" class="btn-3d-pill green-solid" onclick="window.app.jumpToLinkedDraw('${d.id}')">Entrar ➔</button>`}
        </div>
      `).join('')}

      ${archivedLinked.length > 0 ? `
        <div class="divider-ready">🕰️ Histórico de Años Pasados</div>
        ${archivedLinked.map(d => `
          <div class="wish-item">
            <div>
              <div style="font-weight:800;">📜 ${escapeHtml(d.title)}</div>
              <div style="font-size:0.78rem;color:var(--muted);">${escapeHtml(d.dateText || '')}</div>
            </div>
            <button type="button" class="btn-3d-pill gold" onclick="window.app.jumpToLinkedDraw('${d.id}')">Ver historial</button>
          </div>
        `).join('')}
      ` : ''}

      <div class="admin-section" style="margin-top:16px;">
        <div class="field-label">🔗 ¿Tienes el código de otra familia o grupo?</div>
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
          <input id="linkFamilyCodeInput" class="input-christmas" style="flex:1;min-width:160px;" placeholder="Ej. PANDILLA-AMIGOS" />
          <button type="button" class="btn-3d-pill green-solid" onclick="window.app.linkAnotherFamilyByCode()">🔗 Vincular</button>
        </div>
      </div>
    `;
  }

  document.getElementById('mainView').innerHTML = `
    <div class="user-session-bar">
      <div style="display:flex;align-items:center;gap:10px;">
        <div class="avatar-circle ${user.avatar ? 'has-photo' : ''}" style="width:42px;height:42px;font-size:1.1rem;">
          ${getAvatarDisplay(user)}
        </div>
        <div>
          <div style="font-size:0.72rem;font-weight:800;color:var(--muted);text-transform:uppercase;">Tu perfil</div>
          <div style="font-weight:800;color:var(--pine);font-size:1rem;">${escapeHtml(user.name)}</div>
        </div>
      </div>
      <button type="button" class="btn-3d-pill red" onclick="window.app.backToGrid()">🚪 Salir</button>
    </div>
    ${welcomeHtml}
    ${tabsHtml}
    ${bodyHtml}
  `;
}

function updateAdminPinDotsOnly() {
  for (let i = 0; i < 4; i++) {
    const dot = document.getElementById('admin-dot-' + i);
    if (!dot) continue;
    const filled = enteredAdminPin.length > i;
    dot.className = 'pin-dot' + (filled ? ' filled' : '');
    dot.textContent = filled ? '•' : '';
  }
}

function renderAdminLoginScreen() {
  document.getElementById('mainView').innerHTML = `

      <div style="font-size:2.2rem;margin-bottom:6px;">🔐</div>

      <p style="font-size:0.88rem;color:var(--muted);margin-top:4px;">

   8. PANEL DE ORGANIZACIÓN (3 PESTAÑAS LIMPIAS Y CON AIRE)
========================================================= */
function renderAdminScreen() {
  const draw = getCurrentDraw();

  const cloudBarClass = cloudStatus === 'error' ? 'error' : (cloudStatus === 'connecting' ? 'connecting' : '');
  const cloudBarText = cloudStatus === 'connected'
    ? '☁️ Nube Firebase conectada y sincronizada'
    : (cloudStatus === 'connecting'
      ? '⏳ Conectando con la nube Firebase...'
      : `⚠️ Error nube: ${cloudErrorMsg || 'Revisa reglas/Authentication en Firebase'}`);

  const cloudBarHtml = `
    <div class="cloud-status-bar ${cloudBarClass}">
      <span>${cloudBarText}</span>
      <button type="button" class="btn-3d-pill" style="padding:6px 12px;font-size:0.75rem;" onclick="window.app.forceCloudSync()">
        🔄 Sincronizar

  const adminTabsHtml = `
    <div class="admin-nav-tabs">
      <button type="button" class="admin-tab-btn ${adminTab === 'current' ? 'active' : ''}" onclick="window.app.setAdminTab('current')">
        <span style="font-size:1.25rem;">🎲</span>
        <span>Sorteo Actual</span>
      </button>
      <button type="button" class="admin-tab-btn ${adminTab === 'participants' ? 'active' : ''}" onclick="window.app.setAdminTab('participants')">
        <span style="font-size:1.25rem;">👥</span>
        <span>Participantes</span>
      </button>
      <button type="button" class="admin-tab-btn ${adminTab === 'draws' ? 'active' : ''}" onclick="window.app.setAdminTab('draws')">

        <span>Org. General</span>

    </div>

  /* --- PESTAÑA ADMIN 1: SORTEO ACTUAL --- */

    if (!draw) {
      tabBodyHtml = `
        <div class="admin-section" style="text-align:center;">
          <p style="font-weight:800;margin-bottom:12px;">No hay ningún sorteo seleccionado.</p>
          <button type="button" class="btn-big btn-green" onclick="window.app.setAdminTab('draws')">➕ Elegir o crear uno en Organización General</button>
        </div>
      `;
    } else {
      const isoVal = (draw.countdownIso || '2026-12-20T20:00').slice(0, 16);
      const exclusions = Array.isArray(draw.exclusions) ? draw.exclusions : [];
      const avoidLastYear = draw.avoidLastYear !== false;
      const prevPairs = getPreviousYearPairsForDraw(draw);

      const participantOptionsA = draw.participants.map((p, idx) =>
        `<option value="${p.id}" ${idx === 0 ? 'selected' : ''}>${escapeHtml(p.name)}</option>`
      ).join('');
      const participantOptionsB = draw.participants.map((p, idx) =>
        `<option value="${p.id}" ${idx === 1 ? 'selected' : ''}>${escapeHtml(p.name)}</option>`
      ).join('');

      const exclusionsListHtml = exclusions.length > 0
        ? exclusions.map((pair, idx) => {
            const pA = draw.participants.find(p => p.id === pair[0]);
            const pB = draw.participants.find(p => p.id === pair[1]);
            if (!pA || !pB) return '';
            return `
              <div class="exclusion-chip">
                <span>🚫 ${escapeHtml(pA.name)} ↔ ${escapeHtml(pB.name)}</span>
                <button type="button" class="btn-3d-pill red" style="padding:6px 11px;font-size:0.75rem;" onclick="window.app.removeExclusionPair(${idx})">
                  ✕ Quitar
                </button>
              </div>
            `;
          }).join('')
        : `<p style="font-size:0.82rem;color:var(--muted);margin-bottom:4px;">No hay parejas bloqueadas manualmente todavía.</p>`;

      tabBodyHtml = `
        <div class="admin-section">
          <div class="section-label">📲 Compartir y Controlar Sorteo</div>
          <div style="display:grid;gap:12px;">

            </button>
            <button type="button" class="btn-big btn-red" onclick="window.app.executeLiveDraw()">
              🎰 Lanzar / Repetir Sorteo en Directo
            </button>
            <button type="button" class="btn-big btn-gold" onclick="window.app.toggleCountdownMode()">
              ${draw.status === 'countdown'
                ? '🎁 Cambiar a estado "Ya Sorteado"'
                : '⏳ Volver a estado "Cuenta Atrás"'}
            </button>

        </div>

        <div class="admin-section">
          <div class="section-label">🚫 Bloqueos (Parejas y Año Anterior)</div>

              <input type="checkbox" ${avoidLastYear ? 'checked' : ''} onclick="event.stopPropagation()" onchange="window.app.toggleAvoidLastYear(this.checked)" />
              <div style="flex:1;">

                  <span style="font-weight:800;font-size:0.88rem;color:var(--ink);">
                    Evitar repetir parejas del año anterior
                  </span>
                  <span class="prev-pairs-toggle-pill">
                    ${prevPairs.length > 0
                      ? (showPrevYearPairs ? '▲ Ocultar lista' : `👁️ Ver (${prevPairs.length}) ▼`)
                      : (showPrevYearPairs ? '▲ Ocultar' : 'ℹ️ Ver ▼')}
                  </span>
                </div>
                <div style="font-size:0.78rem;color:var(--muted);margin-top:3px;">
                  ${prevPairs.length > 0
                    ? `✅ Detectados <strong>${prevPairs.length}</strong> emparejamientos anteriores con el código <strong>${escapeHtml(draw.familyCode)}</strong> que no se repetirán.`
                    : `Usa el mismo Código de Familia (${escapeHtml(draw.familyCode || '—')}) que en sorteos pasados para bloquear automáticamente lo que tocó el año anterior.`}
                </div>
              </div>
            </div>
            ${showPrevYearPairs ? `
              <div class="prev-pairs-drawer" onclick="event.stopPropagation()">
                ${prevPairs.length > 0
                  ? prevPairs.map(pair => `
                      <div class="prev-pair-row">
                        <span>
                          <strong style="color:var(--pine);">${escapeHtml(pair.giverDisplay)}</strong>
                          <span style="color:var(--crimson);font-weight:900;margin:0 4px;">➔</span>
                          <strong style="color:var(--ink);">${escapeHtml(pair.receiverDisplay)}</strong>
                        </span>
                        <span class="prev-pair-source">📜 ${escapeHtml(pair.sourceTitle)}</span>
                      </div>
                    `).join('')
                  : `<div style="font-size:0.8rem;color:var(--muted);text-align:center;padding:4px 0;">
                       No se encontraron emparejamientos previos con el código <strong>${escapeHtml(draw.familyCode || '—')}</strong>.
                     </div>`}
              </div>
            ` : ''}
          </div>

          <div class="pair-blocker-box">
            <div class="field-label" style="margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:6px;">

              <span style="font-weight:700;color:var(--muted);font-size:0.74rem;">No se regalan entre sí</span>

            ${draw.participants.length >= 2 ? `

                <div class="pair-select-col">

              </button>
            ` : `<p style="font-size:0.82rem;color:var(--muted);">Añade al menos 2 participantes para configurar bloqueos.</p>`}

        <div class="admin-section">

            <input id="editDrawTitle" class="input-christmas" value="${escapeHtml(draw.title)}" />

          <div class="field-group">
            <label class="field-label">Código de familia (vincula sorteos de varios años)</label>
            <input id="editDrawFamilyCode" class="input-christmas" value="${escapeHtml(draw.familyCode || '')}" />
          </div>
          <div class="field-grid-2">
            <div>
              <label class="field-label">Fecha visible</label>
              <input id="editDrawDate" class="input-christmas" value="${escapeHtml(draw.dateText || '')}" />

            <div>
              <label class="field-label">Presupuesto máximo</label>
              <input id="editDrawBudget" class="input-christmas" value="${escapeHtml(draw.budget || '')}" />
            </div>
          </div>
          <div class="field-group">
            <label class="field-label">Fecha y hora del reloj de cuenta atrás</label>
            <input id="editDrawCountdown" type="datetime-local" class="input-christmas" value="${isoVal}" />
          </div>
          <button type="button" class="btn-big btn-green" onclick="window.app.saveCurrentDrawSettings()">
            💾 Guardar Cambios del Sorteo
          </button>
        </div>
      `;
    }
  }

  /* --- PESTAÑA ADMIN 2: PARTICIPANTES --- */
  if (adminTab === 'participants') {
    if (!draw) {
      tabBodyHtml = `<div class="admin-section"><p>Crea o selecciona primero un sorteo en Organización General.</p></div>`;
    } else {
      const membersHtml = draw.participants.map(p => {

                <button type="button" class="btn-3d-pill gold" onclick="window.app.resetUserPin('${p.id}')">
                  🔄 Reset PIN

                🗑️ Quitar

            ${isEditingThisAvatar ? `
              <div style="padding-top:10px;border-top:2px dashed var(--border);">
                <div style="font-weight:800;font-size:0.86rem;color:var(--pine);margin-bottom:8px;">

                </div>
                <button type="button" class="btn-3d-pill ${!p.avatar ? 'red-solid' : ''}" style="width:100%;margin-bottom:8px;" onclick="window.app.setParticipantAvatarByAdmin('${p.id}', null)">
                  🔤 Dejar solo inicial (${escapeHtml(p.name.trim().charAt(0).toUpperCase())})
                </button>
                ${buildCategorizedAvatarPickerHtml(p.avatar, 'setParticipantAvatarByAdmin', p.id)}
              </div>
            ` : ''}
          </div>
        `;
      }).join('');

      tabBodyHtml = `
        <div class="admin-section">
          <div class="section-label">➕ Añadir Nuevo Participante</div>
          <div class="field-group">
            <label class="field-label">Nombre del familiar o amigo</label>
            <input id="newMemberName" class="input-christmas" placeholder="Ej. Primo Sergio" value="${escapeHtml(newMemberNameDraft)}" oninput="window.app.setNewMemberDraft(this.value)" />

          <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;">

            </button>
            ${newParticipantAvatar ? `

          ${showNewParticipantAvatarPicker ? `
            <div style="margin-bottom:14px;padding:12px;background:var(--paper);border-radius:16px;border:2px dashed var(--border);">
              <div style="font-weight:800;font-size:0.84rem;color:var(--pine);margin-bottom:6px;">Elige tu avatar o inicial:</div>
              ${buildCategorizedAvatarPickerHtml(newParticipantAvatar, 'pickNewMemberAvatar')}
            </div>
          ` : ''}

          <button type="button" class="btn-big btn-green" onclick="window.app.addParticipant()">
            ➕ Añadir Participante al Sorteo
          </button>
        </div>

        <div class="admin-section">
          <div class="section-label">👥 Lista de Participantes (${draw.participants.length})</div>
          ${membersHtml}
        </div>
      `;

/* =========================================================
   9. CONFETI NATIVO EN CANVAS (ULTRALIGERO)
========================================================= */
function launchConfetti() {
  const canvas = document.getElementById('confetti');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  const pieces = Array.from({ length: 60 }, () => ({
    x: Math.random() * canvas.width,
    y: -20 - Math.random() * 80,
    size: 6 + Math.random() * 6,
    vy: 3 + Math.random() * 4.5,
    vx: -2.2 + Math.random() * 4.4,
    color: ['#B81D24', '#164A31', '#F59E0B', '#FBF7F0'][Math.floor(Math.random() * 4)]
  }));

  let frame = 0;
  function step() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    pieces.forEach(p => {
      p.x += p.vx;
      p.y += p.vy;
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x, p.y, p.size, p.size);
    });
    frame++;
    if (frame < 75) requestAnimationFrame(step);
    else ctx.clearRect(0, 0, canvas.width, canvas.height);
  }
  requestAnimationFrame(step);
}

  executeLiveDraw() {
    const draw = getCurrentDraw();
    if (!draw || draw.participants.length < 2) {
      showToast('⚠️ Se necesitan al menos 2 participantes');
      return;
    }

    const ids = draw.participants.map(p => p.id);
    const forbidden = new Set();

    // 1. Prohibir regalarse a uno mismo
    ids.forEach(id => forbidden.add(`${id}->${id}`));

    // 2. Prohibir parejas bloqueadas manualmente (bidireccional)
    (draw.exclusions || []).forEach(([a, b]) => {
      forbidden.add(`${a}->${b}`);
      forbidden.add(`${b}->${a}`);
    });

    // 3. Prohibir emparejamientos del año anterior (mismo Código de Familia)
    if (draw.avoidLastYear !== false) {
      const prevPairs = getPreviousYearPairsForDraw(draw);
      prevPairs.forEach(pair => {
        const giver = draw.participants.find(p => p.name.trim().toLowerCase() === pair.giverName);
        const receiver = draw.participants.find(p => p.name.trim().toLowerCase() === pair.receiverName);
        if (giver && receiver) {
          forbidden.add(`${giver.id}->${receiver.id}`);
        }
      });
    }

    // Buscador con backtracking + aleatorización y tope de seguridad para evitar bloqueos del navegador
    const assignment = {};
    const usedReceivers = new Set();
    const giversOrder = [...ids].sort(() => Math.random() - 0.5);
    let steps = 0;
    const MAX_STEPS = 50000;

    function backtrack(index) {
      if (++steps > MAX_STEPS) return false;
      if (index === giversOrder.length) return true;
      const giverId = giversOrder[index];
      const candidates = ids
        .filter(rId => !usedReceivers.has(rId) && !forbidden.has(`${giverId}->${rId}`))
        .sort(() => Math.random() - 0.5);

      for (const rId of candidates) {
        assignment[giverId] = rId;
        usedReceivers.add(rId);
        if (backtrack(index + 1)) return true;
        usedReceivers.delete(rId);
        delete assignment[giverId];
      }
      return false;
    }

    const found = backtrack(0);
    if (!found) {
      showToast('⚠️ Imposible sortear con tantos bloqueos. Quita alguna exclusión o añade participantes.');
      return;
    }

    draw.participants.forEach(p => {
      p.targetId = assignment[p.id];
      p.revealed = false;
    });
    draw.status = 'drawn';
    saveState();
    launchConfetti();
    renderAll();
    showToast('🎉 ¡Sorteo realizado respetando todos los bloqueos!');
  },

  confirmDeleteDraw(drawId) {
    draws = draws.filter(d => d.id !== drawId);
    confirmDeleteDrawId = null;
    if (currentDrawId === drawId) {
      currentDrawId = null;
    }
    saveState();
    renderAll();
    showToast('🗑️ Sorteo eliminado definitivamente');
  },

  createNewDraw() {
    const title = document.getElementById('newDrawTitle')?.value.trim();
    const familyCode = (document.getElementById('newDrawFamilyCode')?.value.trim() || 'FAMILIA').toUpperCase();
    const budget = document.getElementById('newDrawBudget')?.value.trim() || '30€';
    const dateText = document.getElementById('newDrawDate')?.value.trim() || '24 Dic 2026';
    const rawMembers = document.getElementById('newDrawMembers')?.value || '';

    if (!title) {
      showToast('✍️ Escribe un título para el sorteo');
      return;
    }

    const names = rawMembers.split(',').map(s => s.trim()).filter(Boolean);
    const participants = (names.length > 0 ? names : ['Participante 1', 'Participante 2']).map((name, i) => ({
      id: `p_${Date.now()}_${i}`,
      name,
      avatar: null,
      pin: null,
      targetId: null,
      revealed: false,
      wishes: [],
      noWishes: []
    }));

    const newDraw = {
      id: generateSecureDrawId(),
      familyCode,
      title,
      dateText,
      countdownIso: '2026-12-24T20:00:00',
      budget,
      status: 'countdown',
      avoidLastYear: true,
      exclusions: [],
      participants
    };

    draws.unshift(newDraw);
    currentDrawId = newDraw.id;
    hasAppliedUrlDraw = true;
    adminTab = 'current';
    saveState();
    renderAll();
    showToast(`🎉 Sorteo "${title}" creado`);
  },

  changeAdminPin() {
    const val = (document.getElementById('newAdminPinInput')?.value || '').trim();
    if (!/^\d{4}$/.test(val)) {
      showToast('⚠️ La clave debe tener exactamente 4 números');
      return;
    }
    adminPinCode = val;
    saveState();
    renderAdminScreen();
    showToast('🔐 Nueva clave de Organización guardada');
  }
};

/* Arranque instantáneo + conexión en segundo plano a Firebase */
renderAll();
initCloudStorage();
</script>
