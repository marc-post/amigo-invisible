          }).join('')
        : `<p style="grid-column:1/-1;text-align:center;font-size:0.82rem;color:var(--muted);padding:12px;">Sin avatares en esta categoría.</p>`;

      return `
        <div>
          <div class="folder-tabs">${folderTabs}</div>
          <div class="avatar-grid">${tiles}</div>
        </div>
      `;
    }

    function buildUserAvatarShowcaseHtml(user) {
      ensureValidActiveFolder();
      const selectedAvatarId = user?.avatar || null;
      const effectiveSelId = selectedAvatarId ? (LEGACY_AVATAR_ID_MAP[selectedAvatarId] || selectedAvatarId) : null;
      const selectedAvObj = getAvatarById(selectedAvatarId);

      const renderDrawerForFolder = (folderObj) => {
        const { icon, title } = splitFolderIconAndTitle(folderObj.label);
        const items = avatarCatalog.filter(a => a.folder === folderObj.id);
        const tilesHtml = items.length > 0
          ? items.map(a => {
              const isSel = Boolean(effectiveSelId && (a.id === selectedAvatarId || a.id === effectiveSelId));
              const cls = a.kind === 'badge' ? 'avatar-img badge' : (a.kind === 'flag' ? 'avatar-img flag' : 'avatar-img');
              return `
                <button type="button" class="avatar-tile ${isSel ? 'selected' : ''}" onclick="window.app.selectMyAvatar('${escapeHtml(a.id)}')">
                  ${isSel ? '<span class="avatar-check-badge">✓</span>' : ''}
                  <div class="avatar-circle has-photo" style="width:52px;height:52px;">
                    <img src="${escapeHtml(a.url)}" alt="${escapeHtml(a.name)}" class="${cls}" loading="lazy" onerror="this.style.display='none'" />
                  </div>
                  <span class="avatar-tile-name">${escapeHtml(a.name)}</span>
                </button>
              `;
            }).join('')
          : `<p style="grid-column:1/-1;text-align:center;font-size:0.82rem;color:var(--muted);padding:14px;">Sin avatares en esta categoría.</p>`;

        return `
          <div id="openAvatarDrawerBox" class="avatar-category-drawer">
            <div class="drawer-header">
              <div style="display:flex;align-items:center;gap:7px;min-width:0;">
                <span style="font-size:1.2rem;">${escapeHtml(icon)}</span>
                <span style="font-weight:900;font-size:0.95rem;color:var(--pine);">${escapeHtml(title)}</span>
                <span class="status-tag tag-gold">${items.length}</span>
              </div>
              <button type="button" class="btn-3d-pill" style="padding:5px 11px;font-size:0.74rem;flex-shrink:0;" onclick="window.app.toggleUserAvatarFolder(null)">
                ▲ Plegar
              </button>
            </div>
            <div id="userAvatarDrawerScroll" class="drawer-scroll-area">
              <div class="drawer-avatar-grid">${tilesHtml}</div>
            </div>
            <div class="drawer-footer">
              <span style="font-size:0.76rem;font-weight:800;color:var(--muted);">
                ${selectedAvObj ? `✅ Elegido: <strong style="color:var(--pine);">${escapeHtml(selectedAvObj.name)}</strong>` : '👆 Toca cualquier avatar para ponértelo'}
              </span>
              <button type="button" class="btn-3d-pill green-solid" style="padding:6px 13px;font-size:0.78rem;" onclick="window.app.setUserTab('mywishes')">
                📝 Ir a Mis Deseos →
              </button>
            </div>
          </div>
        `;
      };

      const chunks = [];
      const total = avatarFolders.length;
      for (let i = 0; i < total; i++) {
        const f = avatarFolders[i];
        const { icon, title } = splitFolderIconAndTitle(f.label);
        const folderItems = avatarCatalog.filter(a => a.folder === f.id);
        const isOpen = openUserAvatarFolder === f.id;
        const hasUserPick = Boolean(selectedAvObj && selectedAvObj.folder === f.id);
        const isLoneLast = (total % 2 === 1) && (i === total - 1);

        const previewsHtml = folderItems.slice(0, 3).map(a => {
          const cls = a.kind === 'badge' ? 'badge' : (a.kind === 'flag' ? 'flag' : '');
          return `
            <span class="cat-mini-thumb">
              <img src="${escapeHtml(a.url)}" alt="" class="${cls}" loading="lazy" onerror="this.parentElement.style.display='none'" />
            </span>
          `;
        }).join('');

        chunks.push(`
          <button
            type="button"
            class="cat-card ${isOpen ? 'open' : ''} ${!isOpen && hasUserPick ? 'has-user-pick' : ''} ${isLoneLast ? 'full-span' : ''}"
            onclick="window.app.toggleUserAvatarFolder('${escapeHtml(f.id)}')"
          >
            <div class="cat-card-top">
              <div style="display:flex;align-items:center;gap:8px;min-width:0;">
                <span class="cat-icon-badge">${escapeHtml(icon)}</span>
                ${isLoneLast ? `<span class="cat-card-title">${escapeHtml(title)}</span>` : ''}
              </div>
              <div class="cat-mini-stack">${previewsHtml}</div>
            </div>
            ${!isLoneLast ? `<div class="cat-card-title">${escapeHtml(title)}</div>` : ''}
            <div class="cat-card-meta">
              <span>${hasUserPick && !isOpen ? '★ Tu avatar · ' : ''}${folderItems.length} avatar${folderItems.length === 1 ? '' : 'es'}</span>
              <span class="cat-chevron-pill">${isOpen ? 'Cerrar ▲' : 'Abrir ▼'}</span>
            </div>
          </button>
        `);

        // Al cerrar cada fila de 2 tarjetas (o la última), si alguna de esa fila está abierta, desplegar justo debajo
        const isRowEnd = (i % 2 === 1) || (i === total - 1);
        if (isRowEnd && openUserAvatarFolder) {
          const rowStart = (i % 2 === 1) ? i - 1 : i;
          for (let r = rowStart; r <= i; r++) {
            if (avatarFolders[r] && avatarFolders[r].id === openUserAvatarFolder) {
              chunks.push(renderDrawerForFolder(avatarFolders[r]));
              break;
            }
          }
        }
      }

      return `<div class="cat-showcase-grid">${chunks.join('')}</div>`;
    }

    /* --- PANTALLA 1: PORTADA MULTI-ORGANIZADOR O CUADRÍCULA DEL SORTEO --- */
    function renderGridScreen() {
      const container = document.getElementById('appContent');
      const draw = getCurrentDraw();

      if (!draw) {

    function renderPinScreen() {

    window.app = {
      /* --- Navegación y PIN usuario --- */
      selectPerson(userId) {
        selectedUserId = userId;
        enteredPin = '';
        currentScreen = 'pin';
        renderAll();
      },

      backToGrid() {
        flushAutosave(true);
        selectedUserId = null;
        enteredPin = '';
        justJoinedWelcome = false;
        openUserAvatarFolder = null;
        currentScreen = 'grid';
        if (!currentDrawId && lastGuestDrawId && draws.some(d => d.id === lastGuestDrawId)) {
          currentDrawId = lastGuestDrawId;
        }
        renderAll();
      },

      pressPin(digit) {
        if (enteredPin.length >= 4) return;
        enteredPin += digit;
        renderPinScreen();
        if (enteredPin.length === 4) {
          setTimeout(() => this.submitPin(), 120);
        }
      },

      clearPin() {
        enteredPin = '';
        renderPinScreen();
      },

      submitPin() {
        const draw = getCurrentDraw();
        const user = draw?.participants?.find(p => p.id === selectedUserId);
        if (!user) return;
        if (enteredPin.length < 4) {
          showToast('Introduce los 4 números de tu PIN');
          return;
        }
        if (!user.pin) {
          user.pin = enteredPin;
          justJoinedWelcome = true;
          addToMyBag(draw.id);
          saveState();
          launchConfetti();
          userTab = 'status';
          currentScreen = 'dashboard';
          renderAll();
          showToast('🎉 ¡PIN creado y guardado!');
          return;
        }
        if (String(user.pin) === enteredPin) {
          justJoinedWelcome = false;
          addToMyBag(draw.id);
          userTab = 'status';
          currentScreen = 'dashboard';
          renderAll();
        } else {
          enteredPin = '';
          renderPinScreen();
          showToast('❌ PIN incorrecto. Inténtalo de nuevo.');
        }
      },

      setUserTab(tab) {
        flushAutosave(true);
        userTab = tab;
        renderDashboardScreen();
      },

      /* --- Sobre, compras y preguntas anónimas --- */
      toggleReveal(open) {
        const draw = getCurrentDraw();
        const user = draw?.participants?.find(p => p.id === selectedUserId);
        if (!user) return;
        user.revealed = open;
        if (open) launchConfetti();
        saveState();
        renderDashboardScreen();
      },

      toggleGiftBought() {
        const draw = getCurrentDraw();
        const user = draw?.participants?.find(p => p.id === selectedUserId);
        if (!user) return;
        user.giftBought = !user.giftBought;
        saveState();
        renderDashboardScreen();
        showToast(user.giftBought ? '🛍️ ¡Genial! Marcado como regalo comprado.' : 'Desmarcado');
      },

      sendAnonQuestion() {
        const draw = getCurrentDraw();
        const user = draw?.participants?.find(p => p.id === selectedUserId);
        const input = document.getElementById('anonQuestionInput');
        if (!draw || !user || !user.targetId || !input) return;
        const text = input.value.trim();
        if (!text) return;
        if (!Array.isArray(draw.anonQuestions)) draw.anonQuestions = [];
        draw.anonQuestions.push({
          id: 'aq_' + Date.now().toString(36),
          toId: user.targetId,
          question: text,
          answer: '',
          createdAt: Date.now()
        });
        input.value = '';

          return;
        }
        isSigningInGoogle = true;
        try {
          pendingOpenAdminAfterLogin = Boolean(openAdmin);
          const provider = new GoogleAuthProvider();
          provider.setCustomParameters({ prompt: 'select_account' });
          await signInWithPopup(auth, provider);
          showToast('✅ ¡Sesión iniciada con Google!');
        } catch (e) {
          pendingOpenAdminAfterLogin = false;
          const code = e?.code || '';
          if (code === 'auth/popup-closed-by-user' || code === 'auth/cancelled-popup-request') {
            return;
          }
          if (code === 'auth/popup-blocked') {
            showToast('⚠️ El navegador bloqueó la ventana de Google. Permite ventanas emergentes.');
          } else if (code === 'auth/unauthorized-domain') {
            showToast('⚠️ Añade este dominio en Firebase Console → Authentication → Authorized domains.');
          } else if (code === 'auth/operation-not-allowed') {
            showToast('⚠️ Activa Google en Firebase Console → Authentication → Sign-in method.');
          } else {
            showToast(`⚠️ Error al entrar con Google: ${e?.message || 'inténtalo de nuevo'}`);
          }
        } finally {
          isSigningInGoogle = false;
        }
      },

      async forceCloudSync() {
        cloudStatus = 'connecting';
        renderAdminScreen();
        try {
          if (!db || !drawsColRef) {
            await initCloudStorage();
          } else if (currentUser) {
            // Sincronización de SOLO LECTURA desde Firebase (nunca sobrescribe la nube)
            if (isGoogleOrganizer(currentUser)) {
              const qs = await getDocs(query(drawsColRef, where('ownerId', '==', currentUser.uid)));
              ownerDrawsMap.clear();
              qs.forEach(docSnap => {
                const data = mergeIncomingDrawPreservingLocalDraft({ id: docSnap.id, ...docSnap.data() });
                ownerDrawsMap.set(docSnap.id, data);
              });
              rebuildDrawsArray();
              if (currentScreen === 'admin' && currentDrawId && !ownerDrawsMap.has(currentDrawId)) {
                currentDrawId = getMyOwnedDraws()[0]?.id || null;
              }
            }

            if (avatarsDocRef) {
              const avSnap = await getDoc(avatarsDocRef);
              if (avSnap.exists()) {
                avatarsCloudDocExists = true;
                const data = avSnap.data() || {};
                if (Array.isArray(data.avatarFolders) && data.avatarFolders.length > 0) {
                  avatarFolders = data.avatarFolders;
                  sortAvatarFolders();
                  localStorage.setItem(AVATAR_FOLDERS_BACKUP_KEY, JSON.stringify(avatarFolders));
                }
                if (Array.isArray(data.avatarCatalog) && data.avatarCatalog.length > 0) {
                  avatarCatalog = data.avatarCatalog;
                  sortAvatarCatalog();
                  localStorage.setItem(AVATAR_CATALOG_BACKUP_KEY, JSON.stringify(avatarCatalog));
                }
                ensureValidActiveFolder();
              } else {
                avatarsCloudDocExists = false;
              }
            }

            if (isSuperAdminUser()) {
              if (avatarRequestsColRef) {
                const reqQs = await getDocs(avatarRequestsColRef);
                const list = [];
                reqQs.forEach(docSnap => list.push({ id: docSnap.id, ...docSnap.data() }));
                list.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
                avatarRequests = list;
              }
              if (organizersColRef) {
                const orgQs = await getDocs(organizersColRef);
                superAdminOrganizersMap.clear();
                orgQs.forEach(docSnap => {
                  superAdminOrganizersMap.set(docSnap.id, { uid: docSnap.id, ...docSnap.data() });
                });
              }
              if (drawsColRef) {
                const allDrawsQs = await getDocs(drawsColRef);
                superAdminDrawStatsMap.clear();
                allDrawsQs.forEach(docSnap => {
                  const data = docSnap.data() || {};
                  const ownerId = data.ownerId || 'sin_dueno';
                  const prev = superAdminDrawStatsMap.get(ownerId) || {
                    count: 0,
                    totalParticipants: 0,
                    lastActivityAt: 0,
                    ownerEmail: data.ownerEmail || ''
                  };
                  prev.count += 1;
                  prev.totalParticipants += Array.isArray(data.participants) ? data.participants.length : 0;
                  prev.lastActivityAt = Math.max(prev.lastActivityAt, data.updatedAt || data.createdAt || 0);
                  if (!prev.ownerEmail && data.ownerEmail) prev.ownerEmail = data.ownerEmail;
                  superAdminDrawStatsMap.set(ownerId, prev);
                });
              }
              await checkLegacyMigration();
            }

            if (urlDrawId && drawsColRef) {
              try {
                const urlSnap = await getDoc(doc(drawsColRef, urlDrawId));
                if (urlSnap.exists()) {
                  const data = mergeIncomingDrawPreservingLocalDraft({ id: urlSnap.id, ...urlSnap.data() });
                  guestDrawsMap.set(urlSnap.id, data);
                  rebuildDrawsArray();
                }
              } catch (e) {}
            }
            await loadMyBagDraws(true);
            refreshLegacyMigrationInfo();
            hasReceivedCloudSnapshot = true;
            cloudStatus = 'connected';
            cloudErrorMsg = '';
          }
          renderAll();
          showToast('☁️ Datos actualizados desde Firebase');
        } catch (e) {
          cloudStatus = 'error';
          cloudErrorMsg = e?.message || 'Error de red';
          renderAdminScreen();
        }
      },

          draw.status = 'drawn';

      handleAvatarFileUpload(event) {
        if (!isSuperAdminUser()) return;
        const file = event.target?.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            const size = 220;
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#FFFFFF';
            ctx.fillRect(0, 0, size, size);
            if (newAvatarKindDraft === 'badge') {
              const scale = Math.min(size / img.width, size / img.height);
              const dw = img.width * scale;
              const dh = img.height * scale;
              ctx.drawImage(img, (size - dw) / 2, (size - dh) / 2, dw, dh);
            } else {
              const minSide = Math.min(img.width, img.height);
              const sx = (img.width - minSide) / 2;
              const sy = (img.height - minSide) / 2;
              ctx.drawImage(img, sx, sy, minSide, minSide, 0, 0, size, size);
            }
            newAvatarUrlDraft = canvas.toDataURL('image/jpeg', 0.8);
            renderAdminScreen();
            showToast('📷 Imagen cargada y optimizada');
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      },

        avatarFolders.push({ id, label });
        sortAvatarFolders();
        activeAvatarFolder = id;
        newAvatarFolderDraft = id;
        saveAvatarCatalogState();
        renderAdminScreen();
        showToast(`📁 Categoría "${label}" creada`);
      },

      renameAvatarFolder(folderId) {
        if (!isSuperAdminUser()) return;
        const input = document.getElementById(`renameFolder_${folderId}`);
        const newLabel = (input?.value || '').trim();
        if (!newLabel) return;
        const f = avatarFolders.find(x => x.id === folderId);
        if (f) {
          f.label = newLabel;
          sortAvatarFolders();
          saveAvatarCatalogState();
          renderAdminScreen();
          showToast('💾 Categoría renombrada');
        }
      },

      askDeleteAvatarFolder(folderId) {
        if (!isSuperAdminUser()) return;
        if (avatarFolders.length <= 1) {
          showToast('Debe quedar al menos 1 categoría');
          return;
        }
        confirmDeleteFolderId = folderId;
        renderAdminScreen();
      },

      confirmDeleteAvatarFolder(folderId) {
        if (!isSuperAdminUser()) return;
        avatarFolders = avatarFolders.filter(f => f.id !== folderId);
        avatarCatalog = avatarCatalog.filter(a => a.folder !== folderId);
        confirmDeleteFolderId = null;
        ensureValidActiveFolder();
        saveAvatarCatalogState();
        renderAdminScreen();
        showToast('🗑️ Categoría eliminada');
      },

      deleteAvatarFromCatalog(avatarId) {
        if (!isSuperAdminUser()) return;
        avatarCatalog = avatarCatalog.filter(a => a.id !== avatarId);
        saveAvatarCatalogState();
        renderAdminScreen();
        showToast('🗑️ Avatar eliminado');
      },

      askRestoreAvatarCatalog() {
        if (!isSuperAdminUser()) return;
        confirmRestoreCatalog = true;
        renderAdminScreen();
      },

      async confirmRestoreAvatarCatalog() {
        if (!isSuperAdminUser()) return;
        avatarFolders = DEFAULT_AVATAR_FOLDERS.map(f => ({ ...f }));
        avatarCatalog = DEFAULT_AVATAR_CATALOG.map(a => ({ ...a }));
        sortAvatarFolders();
        sortAvatarCatalog();
        confirmRestoreCatalog = false;
        ensureValidActiveFolder();
        const savedInCloud = await saveAvatarCatalogState();
        legacyDismissed.avatarsMigrated = true;
        await saveLegacyDismissedState();
        refreshLegacyMigrationInfo();
        renderAdminScreen();
        showToast(savedInCloud
          ? `🔄 Catálogo de fábrica (${avatarCatalog.length} avatares) guardado en Firestore`
          : `⚠️ Catálogo restaurado en local, pero falló Firestore: ${cloudErrorMsg || 'revisa permisos'}`);
      },

      /* --- Organización general (Sorteos y clave) --- */
      selectAdminDraw(drawId) {
        currentDrawId = drawId;
        adminTab = 'current';
        renderAll();
      },

      askDeleteDraw(drawId) {
        confirmDeleteDrawId = drawId;
        renderAdminScreen();
      },

      async confirmDeleteDraw(drawId) {
        if (!isGoogleOrganizer()) return;
        ownerDrawsMap.delete(drawId);
        guestDrawsMap.delete(drawId);
        rebuildDrawsArray();
        if (isSuperAdminUser() && !legacyDismissed.drawIds.includes(drawId)) {
          legacyDismissed.drawIds.push(drawId);
          saveLegacyDismissedState();
          refreshLegacyMigrationInfo();
        }
        if (currentDrawId === drawId) {
          currentDrawId = getMyOwnedDraws()[0]?.id || null;
        }
        confirmDeleteDrawId = null;
        if (db && drawsColRef) {
          try {
            await deleteDoc(doc(drawsColRef, drawId));
          } catch (e) {
            console.warn('Error al borrar sorteo en Firestore:', e);
            showToast('⚠️ No se pudo borrar el sorteo en la nube');
          }
        }
        renderAll();
        showToast('🗑️ Sorteo eliminado');
      },

      cancelConfirmations() {
        confirmDeleteDrawId = null;
        confirmDeleteFolderId = null;
        confirmRestoreCatalog = false;
        renderAdminScreen();
      },

      async createNewDraw() {
        if (!isGoogleOrganizer()) {
          showToast('Inicia sesión con Google para crear sorteos');
          return;
        }
        const title = (document.getElementById('createDrawTitle')?.value || '').trim();
        const familyCode = (document.getElementById('createDrawFamily')?.value || '').trim().toUpperCase();
        const budget = (document.getElementById('createDrawBudget')?.value || '').trim() || '35€';
        const dateText = (document.getElementById('createDrawDate')?.value || '').trim() || '24 Dic';
        const rawPeople = (document.getElementById('createDrawPeople')?.value || '').trim();
        if (!title) {
          showToast('Escribe un título para el sorteo');
          return;
        }
        const names = rawPeople.split(',').map(s => s.trim()).filter(Boolean);
        const newId = generateSecureDrawId();
        const now = Date.now();
        const newDraw = {
          id: newId,
          ownerId: currentUser.uid,
          ownerEmail: currentUser.email || '',
          createdAt: now,
          updatedAt: now,
          title,
          familyCode,
          dateText,
          budget,
          status: 'countdown',
          countdownIso: '2026-12-20T20:00',
          avoidLastYear: true,
          exclusions: [],
          anonQuestions: [],
          participants: names.map((n, idx) => ({
            id: `p_${Date.now().toString(36)}_${idx}`,
            name: n,
            pin: null,
            avatar: null,
            targetId: null,
            revealed: false,
            giftBought: false,
            wishes: [],
            noWishes: [],
            sizes: { clothes: '', shoes: '', color: '' }
          }))
        };
        ownerDrawsMap.set(newId, newDraw);
        rebuildDrawsArray();
        currentDrawId = newId;
        adminTab = 'current';
        await saveDraw(newDraw);
        renderAll();
        showToast(`🎄 Sorteo "${title}" creado`);
      },

      async importLegacyData() {
        if (!isSuperAdminUser() || !legacyMigrationInfo || isMigratingLegacy) return;
        isMigratingLegacy = true;
        renderAdminScreen();
        let importedCount = 0;
        try {
          for (const oldDraw of legacyMigrationInfo.draws) {
            const sanitized = sanitizeSingleDrawForStorage(oldDraw);
            if (!sanitized || !sanitized.id) continue;
            const payload = {
              ...sanitized,
              id: oldDraw.id,
              ownerId: currentUser.uid,
              ownerEmail: currentUser.email || '',
              migratedFromLegacy: true,
              createdAt: oldDraw.createdAt || Date.now(),
              updatedAt: Date.now()
            };
            await setDoc(doc(drawsColRef, payload.id), payload, { merge: true });
            ownerDrawsMap.set(payload.id, payload);
            importedCount++;
          }

          // Fusionar y desduplicar catálogo base completo + avatares antiguos + avatares actuales
          const combinedFolders = [
            ...DEFAULT_AVATAR_FOLDERS,
            ...(legacyRawSnapshotData?.avatarFolders || []),
            ...avatarFolders
          ];
          const combinedCatalog = [
            ...(legacyRawSnapshotData?.avatarCatalog || []),
            ...avatarCatalog,
            ...DEFAULT_AVATAR_CATALOG
          ];
          const deduped = normalizeAndDedupeAvatars(combinedFolders, combinedCatalog);
          avatarFolders = deduped.folders;
          avatarCatalog = deduped.catalog;
          sortAvatarFolders();
          sortAvatarCatalog();
          ensureValidActiveFolder();
          localStorage.setItem(AVATAR_FOLDERS_BACKUP_KEY, JSON.stringify(avatarFolders));
          localStorage.setItem(AVATAR_CATALOG_BACKUP_KEY, JSON.stringify(avatarCatalog));

          await setDoc(avatarsDocRef, stripUndefinedDeep({
            avatarFolders,
            avatarCatalog,
            updatedAt: Date.now()
          }), { merge: true });
          avatarsCloudDocExists = true;

          for (const oldReq of (legacyMigrationInfo.avatarRequests || [])) {
            if (!oldReq || !oldReq.id) continue;
            await setDoc(doc(avatarRequestsColRef, oldReq.id), stripUndefinedDeep(oldReq), { merge: true });
            if (!legacyDismissed.reqIds.includes(oldReq.id)) {
              legacyDismissed.reqIds.push(oldReq.id);
            }
          }

          legacyDismissed.avatarsMigrated = true;
          await saveLegacyDismissedState();

          rebuildDrawsArray();
          refreshLegacyMigrationInfo();
          if (!currentDrawId) {
            currentDrawId = getMyOwnedDraws()[0]?.id || null;
          }
          showToast(importedCount > 0
            ? `✅ ¡${importedCount} sorteo${importedCount === 1 ? '' : 's'} y ${avatarCatalog.length} avatares listos sin duplicados!`
            : `✅ ¡Catálogo reparado (${avatarCatalog.length} avatares sin duplicados) y datos importados!`);
        } catch (e) {
          console.warn('Error al importar desde estado_global:', e);
          showToast(`⚠️ Error al importar: ${e?.message || 'revisa las reglas de Firestore'}`);
        } finally {
          isMigratingLegacy = false;
          renderAll();
        }
      },

      async dismissLegacyMigrationBanner() {
        if (!isSuperAdminUser()) return;
        legacyDismissed.bannerDismissed = true;
        await saveLegacyDismissedState();
        refreshLegacyMigrationInfo();
        renderAdminScreen();
        showToast('✅ Aviso de migración ocultado permanentemente');
      },

      async repairAndCompleteAvatarCatalog() {
        if (!isSuperAdminUser()) return;
        await checkLegacyMigration();
        const combinedFolders = [
          ...DEFAULT_AVATAR_FOLDERS,
          ...(legacyRawSnapshotData?.avatarFolders || []),
          ...avatarFolders
        ];
        // Prioridad a los avatares personalizados actuales/antiguos y completar con los 122 de fábrica sin duplicar
        const combinedCatalog = [
          ...avatarCatalog,
          ...(legacyRawSnapshotData?.avatarCatalog || []),
          ...DEFAULT_AVATAR_CATALOG
        ];
        const deduped = normalizeAndDedupeAvatars(combinedFolders, combinedCatalog);
        avatarFolders = deduped.folders;
        avatarCatalog = deduped.catalog;
        sortAvatarFolders();
        sortAvatarCatalog();
        ensureValidActiveFolder();
        await saveAvatarCatalogState();
        legacyDismissed.avatarsMigrated = true;
        await saveLegacyDismissedState();
        refreshLegacyMigrationInfo();
        renderAdminScreen();
        showToast(`✨ ¡Listo! ${avatarCatalog.length} avatares únicos en ${avatarFolders.length} categorías.`);
      }
    };

    window.addEventListener('beforeunload', () => flushAutosave(true));

    /* Arranque inicial */
    renderAll();
    initCloudStorage();
  </script>
</body>
</html>
